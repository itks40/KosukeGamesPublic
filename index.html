<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Games</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0f0f13;
      color: #e0e0e0;
      font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
      min-height: 100vh;
    }

    header {
      text-align: center;
      padding: 60px 20px 40px;
    }

    header h1 {
      font-size: 2.4rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      color: #ffffff;
    }

    header p {
      margin-top: 10px;
      color: #888;
      font-size: 0.95rem;
    }

    .games {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 24px;
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 24px 80px;
    }

    .card {
      background: #1a1a24;
      border: 1px solid #2a2a3a;
      border-radius: 12px;
      overflow: hidden;
      transition: transform 0.2s, border-color 0.2s;
    }

    .card:hover {
      transform: translateY(-4px);
      border-color: #5566ff;
    }

    .card-thumb {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #12121a;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      user-select: none;
    }

    .card-body {
      padding: 20px;
    }

    .card-title {
      font-size: 1.1rem;
      font-weight: 600;
      color: #ffffff;
      margin-bottom: 8px;
    }

    .card-desc {
      font-size: 0.85rem;
      color: #888;
      line-height: 1.6;
      min-height: 2.8em;
    }

    .card-footer {
      padding: 0 20px 20px;
    }

    .play-btn {
      display: block;
      width: 100%;
      padding: 10px;
      background: #5566ff;
      color: #fff;
      text-align: center;
      text-decoration: none;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      transition: background 0.15s;
    }

    .play-btn:hover {
      background: #7788ff;
    }

    footer {
      text-align: center;
      padding: 30px;
      color: #444;
      font-size: 0.8rem;
      border-top: 1px solid #1e1e2a;
    }
  </style>
</head>
<body>

<header>
  <h1>Games</h1>
  <p>プレイできるゲーム一覧</p>
</header>

<main class="games">

  <div class="card">
    <div class="card-thumb">🔗</div>
    <div class="card-body">
      <div class="card-title">ボンド</div>
      <div class="card-desc"></div>
    </div>
    <div class="card-footer">
      <a class="play-btn" href="./ボンド/" target="_blank" rel="noopener">プレイする</a>
    </div>
  </div>

  <div class="card">
    <div class="card-thumb">⚔️</div>
    <div class="card-body">
      <div class="card-title">トライアングル・タクティクス</div>
      <div class="card-desc"></div>
    </div>
    <div class="card-footer">
      <a class="play-btn" href="./トラタク/" target="_blank" rel="noopener">プレイする</a>
    </div>
  </div>

  <div class="card">
    <div class="card-thumb">⚡</div>
    <div class="card-body">
      <div class="card-title">刹那の見切り</div>
      <div class="card-desc"></div>
    </div>
    <div class="card-footer">
      <a class="play-btn" href="./刹那の見切り/online.html" target="_blank" rel="noopener">プレイする</a>
    </div>
  </div>

  <div class="card">
    <div class="card-thumb">🤖</div>
    <div class="card-body">
      <div class="card-title">バトルレンジャー</div>
      <div class="card-desc"></div>
    </div>
    <div class="card-footer">
      <a class="play-btn" href="https://mukoseitai-game.fly.dev/" target="_blank" rel="noopener">プレイする</a>
    </div>
  </div>

</main>

<footer>
  &copy; 2026
</footer>

</body>
</html>
