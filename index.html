<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KosukeGames</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #080810;
      color: #e0e0e0;
      font-family: 'Noto Sans JP', 'Segoe UI', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ---- background glow ---- */
    body::before {
      content: '';
      position: fixed;
      top: -200px;
      left: 50%;
      transform: translateX(-50%);
      width: 800px;
      height: 500px;
      background: radial-gradient(ellipse at center, rgba(80, 60, 200, 0.18) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    /* ---- header ---- */
    header {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 72px 20px 48px;
    }

    .logo {
      display: inline-block;
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      background: linear-gradient(135deg, #a78bfa, #60a5fa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    header p {
      margin-top: 10px;
      color: #555;
      font-size: 0.9rem;
      letter-spacing: 0.05em;
    }

    /* ---- divider ---- */
    .divider {
      width: 40px;
      height: 2px;
      background: linear-gradient(90deg, #a78bfa, #60a5fa);
      margin: 16px auto 0;
      border-radius: 2px;
    }

    /* ---- grid ---- */
    .games {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 28px;
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 28px 100px;
    }

    /* ---- card ---- */
    .card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 16px;
      overflow: hidden;
      transition: transform 0.25s cubic-bezier(.22,.68,0,1.2), box-shadow 0.25s, border-color 0.25s;
      backdrop-filter: blur(8px);
    }

    .card:hover {
      transform: translateY(-6px) scale(1.01);
      border-color: rgba(167, 139, 250, 0.5);
      box-shadow: 0 16px 40px rgba(80, 60, 200, 0.2);
    }

    .card-thumb {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: linear-gradient(135deg, #0e0e1a, #16163a);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3.5rem;
      user-select: none;
      position: relative;
      overflow: hidden;
    }

    .card-thumb::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom, transparent 50%, rgba(8,8,16,0.6));
    }

    .card-body {
      padding: 20px 22px 12px;
    }

    .card-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: #f0f0ff;
      margin-bottom: 6px;
    }

    .card-desc {
      font-size: 0.82rem;
      color: #666;
      line-height: 1.7;
      min-height: 2.6em;
    }

    .card-footer {
      padding: 12px 22px 22px;
    }

    .play-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 11px;
      background: linear-gradient(135deg, #7c6fe0, #5b8dee);
      color: #fff;
      text-decoration: none;
      border-radius: 10px;
      font-size: 0.88rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      transition: opacity 0.15s, transform 0.15s;
    }

    .play-btn:hover {
      opacity: 0.9;
      transform: scale(0.98);
    }

    .play-btn svg {
      width: 14px;
      height: 14px;
      flex-shrink: 0;
    }

    /* ---- footer ---- */
    footer {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 28px;
      color: #333;
      font-size: 0.78rem;
      letter-spacing: 0.05em;
      border-top: 1px solid rgba(255,255,255,0.05);
    }
  </style>
</head>
<body>

<header>
  <div class="logo">KosukeGames</div>
  <div class="divider"></div>
  <p>プレイできるゲーム一覧</p>
</header>

<main class="games">

  <div class="card">
    <div class="card-thumb">🔗</div>
    <div class="card-body">
      <div class="card-title">ボンド</div>
      <div class="card-desc"></div>
    </div>
    <div class="card-footer">
      <a class="play-btn" href="./ボンド/" target="_blank" rel="noopener">
        <svg viewBox="0 0 16 16" fill="currentColor"><polygon points="4,2 14,8 4,14"/></svg>
        プレイする
      </a>
    </div>
  </div>

  <div class="card">
    <div class="card-thumb">⚔️</div>
    <div class="card-body">
      <div class="card-title">トライアングル・タクティクス</div>
      <div class="card-desc"></div>
    </div>
    <div class="card-footer">
      <a class="play-btn" href="./トラタク/" target="_blank" rel="noopener">
        <svg viewBox="0 0 16 16" fill="currentColor"><polygon points="4,2 14,8 4,14"/></svg>
        プレイする
      </a>
    </div>
  </div>

  <div class="card">
    <div class="card-thumb">⚡</div>
    <div class="card-body">
      <div class="card-title">刹那の見切り２</div>
      <div class="card-desc"></div>
    </div>
    <div class="card-footer">
      <a class="play-btn" href="./刹那の見切り2/" target="_blank" rel="noopener">
        <svg viewBox="0 0 16 16" fill="currentColor"><polygon points="4,2 14,8 4,14"/></svg>
        プレイする
      </a>
    </div>
  </div>

  <div class="card">
    <div class="card-thumb">🗺️</div>
    <div class="card-body">
      <div class="card-title">タイセリオン・ファイト・タクティクス</div>
      <div class="card-desc"></div>
    </div>
    <div class="card-footer">
      <a class="play-btn" href="./TFT簡易版/tft/" target="_blank" rel="noopener">
        <svg viewBox="0 0 16 16" fill="currentColor"><polygon points="4,2 14,8 4,14"/></svg>
        プレイする
      </a>
    </div>
  </div>

</main>

<footer>
  &copy; 2026 KosukeGames
</footer>

</body>
</html>
