<script>
// ══════════════════════════════════════════
// 効果音（Web Audio API）
// ══════════════════════════════════════════
let _audioCtx = null;
function getAudioCtx() {
  if (!_audioCtx) _audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return _audioCtx;
}
function playSound(name) {
  try {
    const ctx = getAudioCtx();
    const t = ctx.currentTime;
    const def = {
      // 質問を送信したとき
      question: () => {
        const o = ctx.createOscillator(); const g = ctx.createGain();
        o.connect(g); g.connect(ctx.destination);
        o.type = 'sine'; o.frequency.setValueAtTime(660, t); o.frequency.linearRampToValueAtTime(880, t + 0.08);
        g.gain.setValueAtTime(0.18, t); g.gain.linearRampToValueAtTime(0, t + 0.12);
        o.start(t); o.stop(t + 0.12);
      },
      // コール宣言
      call: () => {
        [0, 1].forEach((i) => {
          const o = ctx.createOscillator(); const g = ctx.createGain();
          o.connect(g); g.connect(ctx.destination);
          o.type = 'square'; o.frequency.value = [440, 660][i];
          g.gain.setValueAtTime(0, t + i * 0.08); g.gain.linearRampToValueAtTime(0.15, t + i * 0.08 + 0.02);
          g.gain.linearRampToValueAtTime(0, t + i * 0.08 + 0.12);
          o.start(t + i * 0.08); o.stop(t + i * 0.08 + 0.12);
        });
      },
      // フォルド
      fold: () => {
        const o = ctx.createOscillator(); const g = ctx.createGain();
        o.connect(g); g.connect(ctx.destination);
        o.type = 'sine'; o.frequency.setValueAtTime(330, t); o.frequency.linearRampToValueAtTime(220, t + 0.15);
        g.gain.setValueAtTime(0.14, t); g.gain.linearRampToValueAtTime(0, t + 0.2);
        o.start(t); o.stop(t + 0.2);
      },
      // 正解（+2pt）
      correct: () => {
        [[523, 0], [659, 0.1], [784, 0.2], [1047, 0.32]].forEach(([freq, delay]) => {
          const o = ctx.createOscillator(); const g = ctx.createGain();
          o.connect(g); g.connect(ctx.destination);
          o.type = 'triangle'; o.frequency.value = freq;
          g.gain.setValueAtTime(0, t + delay); g.gain.linearRampToValueAtTime(0.2, t + delay + 0.02);
          g.gain.linearRampToValueAtTime(0, t + delay + 0.18);
          o.start(t + delay); o.stop(t + delay + 0.2);
        });
      },
      // 不正解（-1pt）
      wrong: () => {
        [[220, 0], [196, 0.13]].forEach(([freq, delay]) => {
          const o = ctx.createOscillator(); const g = ctx.createGain();
          o.connect(g); g.connect(ctx.destination);
          o.type = 'sawtooth'; o.frequency.value = freq;
          g.gain.setValueAtTime(0.15, t + delay); g.gain.linearRampToValueAtTime(0, t + delay + 0.15);
          o.start(t + delay); o.stop(t + delay + 0.18);
        });
      },
      // ラウンド終了
      roundEnd: () => {
        [[523, 0], [659, 0.1]].forEach(([freq, delay]) => {
          const o = ctx.createOscillator(); const g = ctx.createGain();
          o.connect(g); g.connect(ctx.destination);
          o.type = 'sine'; o.frequency.value = freq;
          g.gain.setValueAtTime(0.14, t + delay); g.gain.linearRampToValueAtTime(0, t + delay + 0.22);
          o.start(t + delay); o.stop(t + delay + 0.25);
        });
      },
      // ゲームオーバー（勝利ファンファーレ）
      gameOver: () => {
        [[523, 0], [659, 0.1], [784, 0.2], [659, 0.32], [784, 0.42], [1047, 0.55]].forEach(([freq, delay]) => {
          const o = ctx.createOscillator(); const g = ctx.createGain();
          o.connect(g); g.connect(ctx.destination);
          o.type = 'triangle'; o.frequency.value = freq;
          g.gain.setValueAtTime(0, t + delay); g.gain.linearRampToValueAtTime(0.22, t + delay + 0.03);
          g.gain.linearRampToValueAtTime(0, t + delay + 0.22);
          o.start(t + delay); o.stop(t + delay + 0.25);
        });
      },
      // 自分のターン通知
      myTurn: () => {
        [[660, 0], [880, 0.1]].forEach(([freq, delay]) => {
          const o = ctx.createOscillator(); const g = ctx.createGain();
          o.connect(g); g.connect(ctx.destination);
          o.type = 'sine'; o.frequency.value = freq;
          g.gain.setValueAtTime(0.15, t + delay); g.gain.linearRampToValueAtTime(0, t + delay + 0.12);
          o.start(t + delay); o.stop(t + delay + 0.14);
        });
      },
    };
    def[name]?.();
  } catch(e) { /* 音声非対応環境では無視 */ }
}

const FIREBASE_DB_URL = 'https://torataku-c1a6b-default-rtdb.asia-southeast1.firebasedatabase.app';

// ── Firebase ヘルパー ──
async function fbWrite(path, data) {
  const res = await fetch(`${FIREBASE_DB_URL}${path}.json`, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(data)
  });
  if (!res.ok) throw new Error(`Firebase write failed: ${res.status}`);
}
async function fbPatch(path, data) {
  const res = await fetch(`${FIREBASE_DB_URL}${path}.json`, {
    method: 'PATCH',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(data)
  });
  if (!res.ok) throw new Error(`Firebase patch failed: ${res.status}`);
}
async function fbRead(path) {
  const res = await fetch(`${FIREBASE_DB_URL}${path}.json`);
  if (!res.ok) throw new Error(`Firebase read failed: ${res.status}`);
  return await res.json();
}
function fbListen(path, onData) {
  let es, retryTimer;
  function connect() {
    if (es) es.close();
    es = new EventSource(`${FIREBASE_DB_URL}${path}.json`);
    es.addEventListener('put', e => {
      const d = JSON.parse(e.data);
      if (d.path === '/') {
        // ルートへの PUT → データがゲーム全体
        onData && onData(d.data);
      } else {
        // サブパスへの PUT → フル状態を再取得して反映する
        fbRead(path).then(data => { onData && onData(data); }).catch(() => {});
      }
    });
    es.addEventListener('patch', () => {
      // patch イベントは部分更新のため、フル状態を再取得して反映する
      fbRead(path).then(data => { onData && onData(data); }).catch(() => {});
    });
    es.onerror = () => {
      setConn(false);
      es.close();
      // 3秒後に自動再接続
      retryTimer = setTimeout(connect, 3000);
    };
  }
  connect();
  return { close: () => { clearTimeout(retryTimer); if (es) es.close(); } };
}

// ══════════════════════════════════════════
// 定数
// ══════════════════════════════════════════
const CARD_TYPES = ['J', 'Q', 'K'];
const CARD_EMOJI = { J: 'J', Q: 'Q', K: 'K' };

// ── デッキ生成・シャッフル ──
function createDeck() {
  const deck = [];
  for (const t of CARD_TYPES) for (let i = 0; i < 4; i++) deck.push(t);
  return deck;
}
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// ── 優先度（1=最高=質問者, 3=最低） ──
function getPriority(playerIdx, questionerIdx) {
  return ((playerIdx - questionerIdx + 3) % 3) + 1;
}

// ══════════════════════════════════════════
// クライアント状態
// ══════════════════════════════════════════
let myRole = null;         // 0, 1, 2
let myName = '';
let roomId = null;
let localPhase = 'lobby';  // ローカル UI フェーズ
let sseGame = null;
let G = {};                // サーバー同期ゲーム状態
let errorMsg = '';
let connected = false;
let cpuTickRunning = false; // 並列 cpuTick 防止フラグ

// 質問選択用ローカル状態
let selCard = null;   // 'J'|'Q'|'K'
let selCount = null;  // 1|2|3

// コール宣言用ローカル状態
let guessCards = [];  // ['J','Q','K'] (3枚選択)

function setConn(v) {
  connected = v;
}

// ══════════════════════════════════════════
// ゲームロジック
// ══════════════════════════════════════════
function generateRoomId() {
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  return Array.from({ length: 5 }, () => chars[Math.floor(Math.random() * chars.length)]).join('');
}

// 初期ゲーム状態（ホストが生成）
function buildInitialG(names, cpuPlayers) {
  const deck = shuffle(createDeck());
  const hands = [deck.slice(0, 3), deck.slice(3, 6), deck.slice(6, 9)];
  const hiddenCards = deck.slice(9, 12);
  return {
    phase: 'question',
    playerNames: names,
    playerScores: [0, 0, 0],
    hands,
    hiddenCards,
    questionerIdx: 0,
    firstQuestionerIdx: 0,  // そのラウンドの最初の質問者（親）
    questionCount: [0, 0, 0],
    log: [],
    callers: [],
    callResponses: {},
    callResponseOrder: [],
    callDeclarations: [],
    declareOrder: [],
    forcedCallResponses: {},  // 全員2回後の強制コール/フォルド回答
    forcedCallQuestionerRef: 0, // 強制コール時の優先度基準
    roundResults: null,
    roundNum: 1,
    cpuPlayers: cpuPlayers || [false, false, false],
  };
}


async function syncGame() {
  await fbWrite(`/rooms/${roomId}/game`, G);
}

// Firebase は配列をオブジェクトとして返す場合があるため正規化する
function normalizeArray(val) {
  if (!val) return [];
  if (Array.isArray(val)) return val;
  // オブジェクト形式 {0: x, 1: y} → 配列に変換
  const maxKey = Math.max(...Object.keys(val).map(Number));
  const arr = [];
  for (let i = 0; i <= maxKey; i++) arr.push(val[i] !== undefined ? val[i] : null);
  return arr;
}

function normalizeG(g) {
  if (!g) return g;
  return {
    ...g,
    hands: g.hands ? [0, 1, 2].map(i => normalizeArray(g.hands[i])) : [[], [], []],
    hiddenCards: normalizeArray(g.hiddenCards),
    callers: normalizeArray(g.callers),
    callResponseOrder: normalizeArray(g.callResponseOrder),
    declareOrder: normalizeArray(g.declareOrder),
    // callDeclarations の guess も配列として正規化
    callDeclarations: normalizeArray(g.callDeclarations).map(d =>
      d ? { ...d, guess: normalizeArray(d.guess) } : d
    ),
    questionCount: normalizeArray(g.questionCount),
    playerScores: normalizeArray(g.playerScores),
    playerNames: normalizeArray(g.playerNames),
    // log の answers も配列として正規化
    log: normalizeArray(g.log).map(e =>
      e ? { ...e, answers: normalizeArray(e.answers) } : e
    ),
    roundResults: g.roundResults ? normalizeArray(g.roundResults) : null,
    forcedCallResponses: (() => {
      const r = g.forcedCallResponses;
      if (!r) return {};
      // Firebase may return {"1":"fold","2":"fold"} as [null,"fold","fold"]
      // Convert array form back to object, dropping null slots
      if (Array.isArray(r)) {
        const obj = {};
        r.forEach((v, i) => { if (v != null) obj[String(i)] = v; });
        return obj;
      }
      return r;
    })(),
    callResponses: g.callResponses || {},
    cpuPlayers: g.cpuPlayers ? [0,1,2].map(i => g.cpuPlayers[i] === true) : [false, false, false],
  };
}

function startSSE() {
  if (sseGame) sseGame.close();
  sseGame = fbListen(`/rooms/${roomId}/game`, (data) => {
    if (!data) return;
    G = normalizeG(data);
    connected = true;
    updateLocalPhase();
    render();
    if (myRole === 0) setTimeout(cpuTick, 500);
  });
}

function updateLocalPhase() {
  const prev = localPhase;
  if (G.phase === 'question') {
    localPhase = 'question';
    // 自分のターンになったとき通知音
    if (prev !== 'question' || G.questionerIdx === myRole) {
      if (G.questionerIdx === myRole) playSound('myTurn');
    }
  } else if (G.phase === 'call-response') {
    // 自分が応答待ちかどうか
    const pending = G.callResponseOrder.find(i => !(String(i) in (G.callResponses || {})));
    if (pending === myRole && !(String(myRole) in (G.callResponses || {}))) {
      if (localPhase !== 'call-response') playSound('myTurn');
      localPhase = 'call-response';
    } else {
      localPhase = 'call-response-wait';
    }
  } else if (G.phase === 'call-declare') {
    const nextDeclarer = G.declareOrder.find(i => !G.callDeclarations.find(d => d.playerIdx === i));
    if (nextDeclarer === myRole) {
      if (localPhase !== 'call-declare') playSound('myTurn');
      localPhase = 'call-declare';
    } else {
      localPhase = 'call-declare-wait';
    }
  } else if (G.phase === 'forced-call') {
    if (prev !== 'forced-call') playSound('myTurn');
    localPhase = 'forced-call';
  } else if (G.phase === 'round-end') {
    if (prev !== 'round-end') {
      // ラウンド結果に応じて音を鳴らす
      const myResult = (G.roundResults || []).find(r => r.playerIdx === myRole);
      if (myResult?.result === 'correct') playSound('correct');
      else if (myResult?.result === 'wrong') playSound('wrong');
      else playSound('roundEnd');
    }
    localPhase = 'round-end';
  } else if (G.phase === 'game-over') {
    if (localPhase !== 'game-over') {
      saveMatchHistory();
      playSound('gameOver');
    }
    localPhase = 'game-over';
  }
}

// ── 対戦戦績を localStorage に保存 ──
function saveMatchHistory() {
  try {
    const sorted = [0, 1, 2]
      .map(i => ({ name: G.playerNames[i], score: G.playerScores[i], isSelf: i === myRole }))
      .sort((a, b) => b.score - a.score);
    const entry = {
      date: new Date().toLocaleDateString('ja-JP', { month: 'numeric', day: 'numeric' }),
      players: sorted,
    };
    const history = JSON.parse(localStorage.getItem('tt_history') || '[]');
    history.unshift(entry);
    if (history.length > 5) history.length = 5; // 最大5件
    localStorage.setItem('tt_history', JSON.stringify(history));
  } catch(e) { /* localStorage 無効環境では無視 */ }
}

// ── 質問送信 ──
async function submitQuestion(cardType, count, asPlayer = myRole) {
  if (G.phase !== 'question') return;
  if (G.questionerIdx !== asPlayer) return;
  try {

  playSound('question');
  // 各プレーヤーの回答を自動計算
  const answers = G.hands.map(hand => hand.filter(c => c === cardType).length);

  const entry = {
    askerIdx: asPlayer,
    askerName: G.playerNames[asPlayer],
    cardType,
    count,
    answers,
  };

  const newLog = [...(G.log || []), entry];
  const newCount = [...G.questionCount];
  newCount[asPlayer]++;

  // 次の質問者
  const nextQuestioner = (asPlayer + 1) % 3;

  // 全員2回ずつ質問したか
  const allAskedTwice = newCount.every(c => c >= 2);

  if (allAskedTwice) {
    G = {
      ...G,
      phase: 'forced-call',
      questionerIdx: nextQuestioner,
      questionCount: newCount,
      log: newLog,
      forcedCallResponses: {},
      forcedCallQuestionerRef: nextQuestioner, // 次の質問者を優先度基準とする
    };
  } else {
    G = {
      ...G,
      phase: 'question',
      questionerIdx: nextQuestioner,
      questionCount: newCount,
      log: newLog,
    };
  }

  updateLocalPhase();
  render();
  await syncGame();
  } catch(e) { errorMsg = '通信エラー: ' + e.message; render(); }
}

function computeNoCallResults() {
  // 全員コールなしでラウンド終了 → 全員0点
  return [0, 1, 2].map(i => ({ playerIdx: i, result: 'no-call', delta: 0 }));
}

// ── コール宣言 ──
async function declareCall(playerIdx) {
  if (G.phase !== 'question') return;
  if (G.callers.includes(playerIdx)) return;
  try {
    const newCallers = [...G.callers, playerIdx];
    const firstCaller = newCallers[0];
    const responseOrder = [(firstCaller + 1) % 3, (firstCaller + 2) % 3];
    G = { ...G, phase: 'call-response', callers: newCallers, callResponses: {}, callResponseOrder: responseOrder };
    updateLocalPhase();
    render();
    await syncGame();
  } catch(e) { errorMsg = '通信エラー: ' + e.message; render(); }
}

// ── コール/フォルド 応答 ──
async function respondCall(playerIdx, response) {
  if (G.phase !== 'call-response') return;
  if (String(playerIdx) in (G.callResponses || {})) return; // 二重送信防止
  playSound(response === 'call' ? 'call' : 'fold');
  try {
    await fbPatch(`/rooms/${roomId}/game/callResponses`, { [String(playerIdx)]: response });
    // callers の即時書き込みはレース条件を起こすため、allResponded ブロックで再構築する

    // ローカルGを即更新して画面を反映
    const newCallers = response === 'call' ? [...G.callers, playerIdx] : G.callers;
    G = { ...G, callResponses: { ...G.callResponses, [String(playerIdx)]: response }, callers: newCallers };
    updateLocalPhase();
    render();

    // 最新状態を読んで全員応答チェック
    const latestGame = normalizeG(await fbRead(`/rooms/${roomId}/game`));
    const latestResponses = latestGame.callResponses || {};
    const allResponded = latestGame.callResponseOrder.every(i => String(i) in latestResponses);

    if (allResponded && latestGame.phase === 'call-response') {
      const qIdx = latestGame.questionerIdx;
      // callResponseOrder に含まれない初期コール者 + call応答した人を集めて callers を再構築
      // （fbWrite を使わないことでレース条件を回避）
      const respOrderSet = new Set(latestGame.callResponseOrder);
      const initialCallers = latestGame.callers.filter(i => !respOrderSet.has(i));
      const respondedCallers = latestGame.callResponseOrder.filter(i => latestResponses[String(i)] === 'call');
      const allCallers = [...initialCallers, ...respondedCallers];
      const sortedCallers = [...allCallers].sort((a, b) => getPriority(b, qIdx) - getPriority(a, qIdx));
      await fbPatch(`/rooms/${roomId}/game`, { phase: 'call-declare', callers: allCallers, declareOrder: sortedCallers, callDeclarations: [] });
    }
  } catch(e) { errorMsg = '通信エラー: ' + e.message; render(); }
}

// ── カード宣言（伏せカードを当てる） ──
async function declareGuess(playerIdx, guess) {
  if (G.phase !== 'call-declare') return;
  try {
    const declIdx = G.callDeclarations.length;
    await fbPatch(`/rooms/${roomId}/game/callDeclarations`, { [declIdx]: { playerIdx, guess } });

    // ローカルGを即更新して画面を反映
    G = { ...G, callDeclarations: [...G.callDeclarations, { playerIdx, guess }] };
    updateLocalPhase();
    render();

    // 最新状態を読んで全員宣言チェック
    const latestGame = normalizeG(await fbRead(`/rooms/${roomId}/game`));
    const allDeclared = latestGame.declareOrder.every(i =>
      latestGame.callDeclarations.find(d => d.playerIdx === i)
    );
    if (allDeclared && latestGame.phase === 'call-declare') {
      const results = computeCallResults(latestGame.callDeclarations, latestGame);
      const newScores = [...latestGame.playerScores];
      results.forEach(r => { newScores[r.playerIdx] += r.delta; });
      await fbPatch(`/rooms/${roomId}/game`, { phase: 'round-end', roundResults: results, playerScores: newScores });
    }
  } catch(e) { errorMsg = '通信エラー: ' + e.message; render(); }
}

function computeCallResults(declarations, gameState) {
  const g = gameState || G;
  const hidden = [...g.hiddenCards].sort();
  const results = [];

  // コールした人
  declarations.forEach(({ playerIdx, guess }) => {
    const guessSort = [...guess].sort();
    const correct = JSON.stringify(guessSort) === JSON.stringify(hidden);
    results.push({
      playerIdx,
      result: correct ? 'correct' : 'wrong',
      delta: correct ? 2 : -1,
      guess,
    });
  });

  // フォルドした人
  [0, 1, 2].forEach(i => {
    if (!declarations.find(d => d.playerIdx === i)) {
      results.push({ playerIdx: i, result: 'fold', delta: 0 });
    }
  });

  return results;
}

// ── 強制コール/フォルド応答（全員2回質問後） ──
async function forcedCallRespond(playerIdx, response) {
  if (G.phase !== 'forced-call') return;
  if ((G.forcedCallResponses || {})[String(playerIdx)] != null) return; // 二重送信防止
  playSound(response === 'call' ? 'call' : 'fold');
  try {
  // ローカルGを即更新してボタンを消す
  G = { ...G, forcedCallResponses: { ...G.forcedCallResponses, [String(playerIdx)]: response } };
  updateLocalPhase();
  render();

  await fbPatch(`/rooms/${roomId}/game/forcedCallResponses`, { [String(playerIdx)]: response });

  const latestGame = normalizeG(await fbRead(`/rooms/${roomId}/game`));
  const responses = latestGame.forcedCallResponses || {};

  // 全員(3人)が応答したか
  if ([0, 1, 2].every(i => responses[String(i)] != null) && latestGame.phase === 'forced-call') {
    const callers = [0, 1, 2].filter(i => responses[String(i)] === 'call');

    if (callers.length === 0) {
      // 誰もコールしなかった → スコアなしでラウンド終了
      await fbPatch(`/rooms/${roomId}/game`, {
        phase: 'round-end',
        roundResults: [0, 1, 2].map(i => ({ playerIdx: i, result: 'no-call', delta: 0 })),
      });
    } else {
      // コール者あり → コール宣言フェーズへ（優先度低い順）
      const qRef = latestGame.forcedCallQuestionerRef ?? 0;
      const sortedCallers = [...callers].sort((a, b) =>
        getPriority(b, qRef) - getPriority(a, qRef)
      );
      await fbPatch(`/rooms/${roomId}/game`, {
        phase: 'call-declare',
        callers: sortedCallers,
        declareOrder: sortedCallers,
        callDeclarations: [],
      });
    }
  }
  } catch(e) { errorMsg = '通信エラー: ' + e.message; render(); }
}

// ── 次のラウンド ──
async function nextRound() {
  const newRoundNum = (G.roundNum || 1) + 1;

  // 全員が1回ずつ親を経験したらゲーム終了（3ラウンド）
  if (newRoundNum > 3) {
    await fbPatch(`/rooms/${roomId}/game`, { phase: 'game-over' });
    return;
  }

  const firstQIdx = newRoundNum - 1; // Round1→P0, Round2→P1, Round3→P2
  const deck = shuffle(createDeck());
  const hands = [deck.slice(0, 3), deck.slice(3, 6), deck.slice(6, 9)];
  const hiddenCards = deck.slice(9, 12);

  G = {
    ...G,
    phase: 'question',
    hands,
    hiddenCards,
    questionerIdx: firstQIdx,
    firstQuestionerIdx: firstQIdx,
    questionCount: [0, 0, 0],
    log: [],
    callers: [],
    callResponses: {},
    callResponseOrder: [],
    callDeclarations: [],
    declareOrder: [],
    forcedCallResponses: {},
    forcedCallQuestionerRef: firstQIdx,
    roundResults: null,
    roundNum: newRoundNum,
    cpuPlayers: G.cpuPlayers || [false, false, false],
  };
  await syncGame();
}

// ══════════════════════════════════════════
// CPU ロジック（P0が全CPUを代理操作）
// ══════════════════════════════════════════
async function cpuTick() {
  if (myRole !== 0 || !roomId) return;
  if (cpuTickRunning) return; // 並列実行を防止
  cpuTickRunning = true;
  const cpus = G.cpuPlayers || [false, false, false];
  try {
    if (G.phase === 'question') {
      if (cpus[G.questionerIdx]) await cpuDoQuestion(G.questionerIdx);
    } else if (G.phase === 'call-response') {
      const waiting = G.callResponseOrder.find(i => !(String(i) in (G.callResponses || {})));
      if (waiting !== undefined && cpus[waiting]) await cpuDoRespondCall(waiting);
    } else if (G.phase === 'call-declare') {
      const nextDeclarer = G.declareOrder.find(i => !G.callDeclarations.find(d => d.playerIdx === i));
      if (nextDeclarer !== undefined && cpus[nextDeclarer]) await cpuDoDeclare(nextDeclarer);
    } else if (G.phase === 'forced-call') {
      const responses = G.forcedCallResponses || {};
      for (let i = 0; i < 3; i++) {
        if (cpus[i] && responses[String(i)] == null) await cpuDoForcedCallRespond(i);
      }
    } else if (G.phase === 'round-end' && cpus[0]) {
      await new Promise(r => setTimeout(r, 1000));
      await nextRound();
    }
  } catch(e) { console.error('cpuTick error:', e); }
  finally { cpuTickRunning = false; }
}

// ログと自分の手札からhidden cardの候補を絞り込む
// answers[i] は実際の枚数が入っているため、質問されたカード種は hidden 枚数が確定する
function inferHiddenPossibilities(cpuPlayerIdx) {
  const hand = G.hands[cpuPlayerIdx] || [];
  const myCounts = {};
  for (const ct of CARD_TYPES) myCounts[ct] = hand.filter(c => c === ct).length;

  const knownHidden = {};
  for (const e of (G.log || [])) {
    if (!(e.cardType in knownHidden)) {
      const total = (e.answers || []).reduce((s, a) => s + a, 0);
      knownHidden[e.cardType] = 4 - total;
    }
  }

  const possibilities = [];
  for (let j = 0; j <= 3; j++) {
    for (let q = 0; q <= 3 - j; q++) {
      const k = 3 - j - q;
      const counts = { J: j, Q: q, K: k };
      let valid = true;
      for (const ct of CARD_TYPES) {
        if (ct in knownHidden) {
          if (counts[ct] !== knownHidden[ct]) { valid = false; break; }
        } else {
          // 自分の手札分 + hidden が 4 を超えてはいけない
          if (myCounts[ct] + counts[ct] > 4) { valid = false; break; }
        }
      }
      if (valid) possibilities.push({ J: j, Q: q, K: k });
    }
  }
  return possibilities;
}

async function cpuDoQuestion(playerIdx) {
  await new Promise(r => setTimeout(r, 800));
  // すでに聞かれた (cardType, count) の組み合わせを除外
  const asked = new Set((G.log || []).map(e => `${e.cardType}:${e.count}`));
  const choices = [];
  for (const ct of CARD_TYPES) {
    for (const n of [1, 2]) {
      if (!asked.has(`${ct}:${n}`)) choices.push([ct, n]);
    }
  }
  if (choices.length === 0) return; // 全組み合わせ済み（通常起こらない）
  const [cardType, count] = choices[Math.floor(Math.random() * choices.length)];
  await submitQuestion(cardType, count, playerIdx);
}

async function cpuDoRespondCall(playerIdx) {
  await new Promise(r => setTimeout(r, 600));
  const poss = inferHiddenPossibilities(playerIdx);
  // 候補が2以下（正答率50%以上）ならコール、3以上ならフォルド
  const response = poss.length <= 2 ? 'call' : 'fold';
  await respondCall(playerIdx, response);
}

async function cpuDoDeclare(playerIdx) {
  await new Promise(r => setTimeout(r, 600));
  const poss = inferHiddenPossibilities(playerIdx);
  // 候補の中からランダムに1つ選ぶ（情報を活かしつつ100%にならない）
  const h = poss[Math.floor(Math.random() * poss.length)];
  const guess = [...Array(h.J).fill('J'), ...Array(h.Q).fill('Q'), ...Array(h.K).fill('K')];
  await declareGuess(playerIdx, guess);
}

async function cpuDoForcedCallRespond(playerIdx) {
  await new Promise(r => setTimeout(r, 3000)); // 人間プレイヤーが操作できるよう長めに待機
  const poss = inferHiddenPossibilities(playerIdx);
  // 候補が2以下（正答率50%以上）ならコール、3以上ならフォルド
  const response = poss.length <= 2 ? 'call' : 'fold';
  await forcedCallRespond(playerIdx, response);
}

// ── 退室 ──
async function leaveRoom() {
  if (!confirm('退室しますか？\nあなたの代わりにCPUが操作します。')) return;
  try {
    const cpus = [...(G.cpuPlayers || [false, false, false])];
    cpus[myRole] = true;
    await fbPatch(`/rooms/${roomId}/game`, {
      cpuPlayers: { 0: cpus[0], 1: cpus[1], 2: cpus[2] }
    });
  } catch(e) {}
  if (sseGame) { sseGame.close(); sseGame = null; }
  sessionStorage.removeItem('tt_room');
  sessionStorage.removeItem('tt_role');
  sessionStorage.removeItem('tt_name');
  roomId = null; myRole = null; G = {};
  localPhase = 'lobby'; lobbyPhase = 'menu';
  render();
}

// ── ロビーでCPU追加（P0のみ） ──
async function doLeaveWaiting() {
  try {
    if (myRole === 0) {
      // P0（部屋オーナー）→ 部屋ごと削除
      if (lobbyPollInterval) { clearInterval(lobbyPollInterval); lobbyPollInterval = null; }
      await fbWrite(`/rooms/${roomId}`, null);
    } else {
      // P1/P2 → 自分のスロットだけ削除
      if (sseGame) { sseGame.close(); sseGame = null; }
      await fbWrite(`/rooms/${roomId}/players/${myRole}`, null);
    }
  } catch(e) {}
  sessionStorage.removeItem('tt_room');
  sessionStorage.removeItem('tt_role');
  sessionStorage.removeItem('tt_name');
  roomId = null; myRole = null;
  localPhase = 'lobby'; lobbyPhase = 'menu';
  render();
}

async function addCpuPlayer(role) {
  try {
    await fbPatch(`/rooms/${roomId}/players`, { [role]: { name: `CPU${role + 1}`, ready: true, cpu: true } });
  } catch(e) { errorMsg = 'CPU追加に失敗: ' + e.message; render(); }
}

// ══════════════════════════════════════════
// ロビー・部屋管理
// ══════════════════════════════════════════
let lobbyPhase = 'enter-name'; // 'enter-name' | 'menu' | 'create-waiting' | 'join-input'
let lobbyJoinCode = '';
let lobbyPollInterval = null;

async function createRoom() {
  try {
    roomId = generateRoomId();
    myRole = 0;
    sessionStorage.setItem('tt_room', roomId);
    sessionStorage.setItem('tt_role', '0');
    sessionStorage.setItem('tt_name', myName);

    await fbWrite(`/rooms/${roomId}`, {
      players: { 0: { name: myName, ready: true } },
      game: null,
      createdAt: Date.now(),
    });
    connected = true;

    lobbyPollInterval = setInterval(async () => {
      try {
        const room = await fbRead(`/rooms/${roomId}`);
        if (!room) return;
        // 5分経過した部屋を削除
        if (room.createdAt && Date.now() - room.createdAt > 5 * 60 * 1000) {
          clearInterval(lobbyPollInterval); lobbyPollInterval = null;
          await fbWrite(`/rooms/${roomId}`, null);
          sessionStorage.removeItem('tt_room'); sessionStorage.removeItem('tt_role'); sessionStorage.removeItem('tt_name');
          roomId = null; myRole = null;
          localPhase = 'lobby'; lobbyPhase = 'menu';
          errorMsg = '5分間待機が続いたため部屋を削除しました。';
          render(); return;
        }
        const players = room.players || {};
        // 全員揃ったらゲーム開始
        if (players[0] && players[1] && players[2]) {
          clearInterval(lobbyPollInterval);
          lobbyPollInterval = null;
          const names = [players[0].name, players[1].name, players[2].name];
          const cpuFlags = [!!players[0].cpu, !!players[1].cpu, !!players[2].cpu];
          G = buildInitialG(names, cpuFlags);
          await syncGame();
          startSSE();
          localPhase = 'question';
          render();
        } else {
          // 待機画面を更新
          render();
        }
      } catch (e) {
        console.error(e);
      }
    }, 1500);

    localPhase = 'lobby-waiting';
    render();
  } catch (e) {
    errorMsg = '部屋の作成に失敗: ' + e.message;
    render();
  }
}

async function joinRoom(code, role) {
  try {
    roomId = code.toUpperCase().trim();
    myRole = role;
    sessionStorage.setItem('tt_room', roomId);
    sessionStorage.setItem('tt_role', String(role));
    sessionStorage.setItem('tt_name', myName);

    const room = await fbRead(`/rooms/${roomId}`);
    if (!room) { errorMsg = '部屋が見つかりません: ' + roomId; render(); return; }

    const players = room.players || {};
    if (players[role]) { errorMsg = `席${role + 1}はすでに使われています`; render(); return; }

    await fbPatch(`/rooms/${roomId}/players`, { [role]: { name: myName, ready: true } });
    connected = true;

    startSSE();
    localPhase = 'lobby-waiting';
    render();

    // P2/P3 もプレーヤー一覧をポーリングで更新
    lobbyPollInterval = setInterval(() => {
      if (localPhase === 'lobby-waiting') render();
      else { clearInterval(lobbyPollInterval); lobbyPollInterval = null; }
    }, 2000);
  } catch (e) {
    errorMsg = '入室に失敗: ' + e.message;
    render();
  }
}

// ══════════════════════════════════════════
// レンダリング
// ══════════════════════════════════════════
function renderLeaveButton() {
  return `<div style="text-align:right;padding:4px 12px 0;">
    <button class="btn" style="font-size:11px;padding:3px 10px;background:rgba(255,255,255,0.1);color:#aac;border:1px solid rgba(255,255,255,0.2);border-radius:6px;cursor:pointer;" onclick="leaveRoom()">退室</button>
  </div>`;
}

const VERSION = 'v0.1.8';

function renderTopbar() {
  const dot = connected
    ? '<span class="conn-dot on"></span>オンライン'
    : '<span class="conn-dot off"></span>オフライン';
  const round = G.phase === 'game-over' ? 'GAME OVER' : (G.roundNum ? `Round ${G.roundNum}` : '');
  return `<div class="topbar">
    <span class="topbar-title">トラタク</span>
    <span style="font-size:12px;color:#aac">${round}</span>
    <span style="font-size:11px;color:#667;margin-right:6px;">${VERSION}</span>
    <span style="font-size:12px">${dot}</span>
  </div>`;
}

function renderScorebar() {
  if (!G.playerNames) return '';
  return `<div class="scorebar">
    ${G.playerNames.map((n, i) => `
      <div class="score-item${i === myRole ? ' me' : ''}">
        <div class="sname">${n}${i === myRole ? '（自分）' : ''}</div>
        <div class="sval">${G.playerScores[i] ?? 0}pt</div>
      </div>`).join('')}
  </div>`;
}

function renderHand() {
  if (!G.hands || myRole === null) return '';
  const hand = [...G.hands[myRole]].sort((a, b) => CARD_TYPES.indexOf(a) - CARD_TYPES.indexOf(b));
  const chips = hand.map(t => `<div class="card-chip ${t}">${t}</div>`).join('');
  return `<div class="section">
    <div class="section-title">あなたの手札（${G.playerNames[myRole]}）</div>
    <div class="hand-display">${chips}</div>
  </div>`;
}

function renderHiddenCards(revealed = false) {
  if (!G.hiddenCards) return '';
  const cards = revealed
    ? G.hiddenCards.map(c => `<div class="card-revealed ${c}">${c}</div>`).join('')
    : `<div class="card-face-down">🂠</div><div class="card-face-down">🂠</div><div class="card-face-down">🂠</div>`;
  return `<div class="section">
    <div class="section-title">場の伏せカード</div>
    <div class="hidden-cards">${cards}</div>
  </div>`;
}

function renderLog() {
  if (!G.log || G.log.length === 0) return '';
  const names = G.playerNames || [];

  // ヘッダー：質問列 + 各プレーヤー列
  const thCells = names.map(n => {
    const label = n.length > 6 ? n.slice(0, 5) + '…' : n;
    return `<th>${label}</th>`;
  }).join('');
  const header = `<tr><th class="col-q">質問</th>${thCells}</tr>`;

  // 行：新しい順（最新が上）
  const rows = [...G.log].reverse().map(e => {
    const qCell = `<td class="col-q">
      <span class="log-asker">${e.askerName}</span>
      <span class="log-question">${e.cardType} を ${e.count}枚以上？</span>
    </td>`;
    const ansCells = names.map((n, i) => {
      if (i === e.askerIdx) return `<td class="col-ans log-ans-self">ー</td>`;
      const has = e.answers[i] >= e.count;
      return `<td class="col-ans ${has ? 'log-ans-yes' : 'log-ans-no'}">${has ? 'はい' : 'いいえ'}</td>`;
    }).join('');
    return `<tr>${qCell}${ansCells}</tr>`;
  }).join('');

  return `<div class="section">
    <div class="section-title">質問ログ</div>
    <div class="log-area">
      <table class="log-table">
        <thead>${header}</thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
  </div>`;
}

function renderQuestionPhase() {
  const isQuestioner = G.questionerIdx === myRole;
  const qName = G.playerNames[G.questionerIdx];
  const qCounts = G.questionCount || [0, 0, 0];

  // 質問回数インジケーター
  const qCountBar = G.playerNames.map((n, i) => {
    const done = qCounts[i];
    const dots = [0,1].map(d => `<span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${d < done ? '#5599ee' : 'rgba(255,255,255,0.2)'};margin:0 2px;"></span>`).join('');
    return `<div style="text-align:center;flex:1;font-size:11px;color:${i === myRole ? '#7fff9a' : '#aac'};">${n}<br>${dots}</div>`;
  }).join('');

  let turnInfo = `<div class="section">
    <div class="phase-banner">質問フェーズ</div>
    <div style="display:flex;padding:8px 12px 4px;">${qCountBar}</div>
    <div class="turn-label">🎤 ${qName} が質問中${G.questionerIdx === G.firstQuestionerIdx && qCounts[G.questionerIdx] === 0 ? ' <span style="font-size:11px;background:rgba(255,215,0,0.2);color:#ffd700;border-radius:4px;padding:1px 6px;">親</span>' : ''}</div>
  </div>`;

  let actionArea = '';
  if (isQuestioner) {
    // カード選択（選択中は背景色・チェックマーク付き）
    const cardBtns = CARD_TYPES.map(t =>
      `<button class="sel-btn ${t}${selCard === t ? ' selected' : ''}" onclick="selCard='${t}';render()">${t}${selCard === t ? ' ✓' : ''}</button>`
    ).join('');
    // 枚数選択
    const countBtns = [1, 2, 3].map(n =>
      `<button class="sel-btn${selCount === n ? ' selected' : ''}" onclick="selCount=${n};render()">${n}枚${selCount === n ? ' ✓' : ''}</button>`
    ).join('');
    const canAsk = selCard !== null && selCount !== null;
    const preview = canAsk
      ? `<div style="padding:6px 0 2px;font-size:14px;color:#a0c4ff;text-align:center;">「<strong>${selCard}</strong>を<strong>${selCount}</strong>枚以上持っていますか？」</div>`
      : `<div style="padding:6px 0 2px;font-size:13px;color:#667;text-align:center;">カードと枚数を選択してください</div>`;
    actionArea = `<div class="section">
      <div class="section-title">質問する（あなたのターン）</div>
      <div style="margin-bottom:6px;font-size:12px;color:#88aadd;">カードの種類</div>
      <div class="sel-group">${cardBtns}</div>
      <div style="margin-bottom:6px;font-size:12px;color:#88aadd;">枚数</div>
      <div class="sel-group">${countBtns}</div>
      ${preview}
      <div class="btn-row">
        <button class="btn btn-primary btn-big" ${canAsk ? '' : 'disabled'} onclick="doSubmitQuestion()">
          質問する
        </button>
      </div>
    </div>`;
  } else {
    actionArea = `<div class="section" style="text-align:center;padding:20px 12px;color:#99aacc;">
      ⏳ ${qName} が質問しています…
    </div>`;
  }

  // コールボタン（全員に表示・目立つ位置）
  const alreadyCalled = G.callers && G.callers.includes(myRole);
  const callBtn = alreadyCalled
    ? ''
    : `<div class="section" style="background:rgba(192,57,43,0.1);border-left:3px solid #c0392b;">
        <button class="btn btn-danger btn-big" onclick="doCall()">🔔 コール！（伏せカードがわかった）</button>
      </div>`;

  return renderTopbar() + renderLeaveButton() + renderScorebar() + renderHand() + renderHiddenCards(false)
    + turnInfo + actionArea + callBtn + renderLog();
}

function renderCallResponsePhase() {
  const myStr = String(myRole);
  const responded = myStr in (G.callResponses || {});
  const isMyTurn = G.callResponseOrder[0] === myRole && !responded
    || (G.callResponseOrder[1] === myRole
      && G.callResponseOrder[0] !== undefined
      && String(G.callResponseOrder[0]) in (G.callResponses || {}));

  // 誰が応答すべきか
  const waiting = G.callResponseOrder.find(i => !(String(i) in (G.callResponses || {})));

  let statusHtml = `<div class="section">
    <div class="phase-banner highlight">🔔 コールが宣言されました！</div>
    <div style="padding:10px 12px;font-size:13px;color:#aac;">
      コール者: ${G.callers.map(i => G.playerNames[i]).join('、')}<br>
      あなたは「コール」か「フォルド」を選んでください。
    </div>
  </div>`;

  let actionHtml = '';
  if (waiting === myRole) {
    actionHtml = `<div class="section">
      <div class="section-title">あなたの応答</div>
      <div class="btn-row">
        <button class="btn btn-danger btn-big" onclick="doRespondCall('call')">📣 コール（私も当てにいく）</button>
        <button class="btn btn-fold btn-big" onclick="doRespondCall('fold')">🏳️ フォルド（降りる）</button>
      </div>
    </div>`;
  } else if (responded) {
    const myResp = G.callResponses[myStr];
    actionHtml = `<div class="section">
      <div class="phase-banner">あなたの回答: ${myResp === 'call' ? '📣 コール' : '🏳️ フォルド'}</div>
      <div style="padding:8px 12px;font-size:13px;color:#aac;">他のプレーヤーの応答を待っています…</div>
    </div>`;
  } else if (waiting !== undefined) {
    actionHtml = `<div class="section">
      <div class="phase-banner">${G.playerNames[waiting]} の応答を待っています…</div>
    </div>`;
  } else {
    actionHtml = `<div class="section">
      <div class="phase-banner">全員の応答を集計中…</div>
    </div>`;
  }

  return renderTopbar() + renderLeaveButton() + renderScorebar() + renderHand() + renderHiddenCards(false)
    + statusHtml + actionHtml + renderLog();
}

function renderCallDeclarePhase() {
  const nextDeclarer = G.declareOrder.find(i => !G.callDeclarations.find(d => d.playerIdx === i));
  const isMyTurn = nextDeclarer === myRole;
  const alreadyDeclared = G.callDeclarations.find(d => d.playerIdx === myRole);

  const prevDeclarations = G.callDeclarations.map(d =>
    `<div style="padding:4px 0;font-size:13px;">${G.playerNames[d.playerIdx]}: ${d.guess.join(' / ')}</div>`
  ).join('');

  let actionHtml = '';
  if (isMyTurn) {
    // 3枚のカードを選択（重複あり）
    const guessCount = { J: 0, Q: 0, K: 0 };
    guessCards.forEach(c => guessCount[c]++);
    const total = guessCards.length;

    const cardBtns = CARD_TYPES.map(t =>
      `<button class="sel-btn ${t}${guessCount[t] > 0 ? ' selected' : ''}" onclick="toggleGuessCard('${t}')">
        ${t} <span style="font-size:13px">×${guessCount[t]}</span>
      </button>`
    ).join('');

    const guessPreview = total > 0
      ? guessCards.map(c => `<div class="card-chip ${c}" style="display:inline-block;">${c}</div>`).join('')
      : '<span style="color:#667;font-size:13px;">まだ選択されていません</span>';
    actionHtml = `<div class="section">
      <div class="section-title">伏せカード3枚を宣言（${total}/3枚）</div>
      <div class="sel-group">${cardBtns}</div>
      <div style="font-size:12px;color:#aac;padding:4px 0;">タップで追加・削除、3枚で宣言できます</div>
      <div style="padding:8px 0;display:flex;gap:8px;min-height:52px;align-items:center;">${guessPreview}</div>
      <button class="btn btn-warn btn-big" ${total === 3 ? '' : 'disabled'} onclick="doDeclareGuess()">
        📢 ${total === 3 ? `「${guessCards.join(' / ')}」と宣言する` : 'カード3枚を選択してください'}
      </button>
    </div>`;
  } else if (alreadyDeclared) {
    actionHtml = `<div class="section">
      <div class="phase-banner">あなたの宣言: ${alreadyDeclared.guess.join(' / ')}</div>
      <div style="padding:8px 12px;font-size:13px;color:#aac;">他のプレーヤーの宣言を待っています…</div>
    </div>`;
  } else if (!G.callers.includes(myRole)) {
    actionHtml = `<div class="section">
      <div class="phase-banner">コールしたプレーヤーの宣言を待っています…</div>
    </div>`;
  } else {
    actionHtml = `<div class="section">
      <div class="phase-banner">${G.playerNames[nextDeclarer]} の宣言を待っています…</div>
    </div>`;
  }

  return renderTopbar() + renderLeaveButton() + renderScorebar() + renderHand()
    + `<div class="section"><div class="phase-banner highlight">📢 コール宣言フェーズ</div>
       <div style="padding:8px 12px;font-size:13px;color:#aac;">優先度の低い順に伏せカードを宣言します。</div>
       ${prevDeclarations ? `<div style="padding:0 12px 8px;">${prevDeclarations}</div>` : ''}
    </div>`
    + actionHtml + renderLog();
}

function renderForcedCallPhase() {
  const responses = G.forcedCallResponses || {};
  const myResponded = String(myRole) in responses;
  const waitingCount = [0, 1, 2].filter(i => !(String(i) in responses)).length;

  const statusRows = G.playerNames.map((n, i) => {
    const resp = responses[String(i)];
    if (!resp) return `<div class="result-row"><span>${n}</span><span style="color:#aaa">考え中…</span></div>`;
    return `<div class="result-row"><span>${n}</span><span>${resp === 'call' ? '<span class="call-badge">コール</span>' : '<span class="fold-badge">フォルド</span>'}</span></div>`;
  }).join('');

  const actionHtml = myResponded
    ? `<div class="section"><div class="phase-banner">✅ 回答済み（他のプレイヤーを待っています… 残り${waitingCount}人）</div></div>`
    : `<div class="section" style="background:rgba(192,57,43,0.12);border-left:3px solid #e74c3c;">
        <div class="section-title" style="color:#ff9999;">⚠️ あなたの選択が必要です</div>
        <div class="btn-row">
          <button class="btn btn-danger btn-big" onclick="doForcedCallRespond('call')">🔔 コール（伏せカードを当てにいく）<br><span style="font-size:11px;font-weight:normal;">正解: +2pt / 不正解: -1pt</span></button>
          <button class="btn btn-fold btn-big" onclick="doForcedCallRespond('fold')">🏳 フォルド（降りる）<br><span style="font-size:11px;font-weight:normal;">点数変動なし ±0pt</span></button>
        </div>
      </div>`;

  return renderTopbar() + renderLeaveButton() + renderScorebar() + renderHand() + renderHiddenCards(false)
    + `<div class="section" style="background:rgba(255,215,0,0.08);border-left:3px solid #ffd700;">
        <div class="phase-banner highlight">⏱️ 全員が2回質問しました！コール or フォルド</div>
        <div style="padding:8px 12px;font-size:13px;color:#ffd700;font-weight:bold;">伏せカードがわかった人は「コール」を選んでください</div>
        <div style="padding:0 12px 8px;">${statusRows}</div>
      </div>`
    + actionHtml + renderLog();
}

function renderRoundEnd() {
  const results = G.roundResults || [];
  const hiddenStr = G.hiddenCards ? G.hiddenCards.join(' / ') : '?';

  const rows = results.sort((a, b) => a.playerIdx - b.playerIdx).map(r => {
    const name = G.playerNames[r.playerIdx];
    let label = '';
    let deltaClass = 'delta-zero';
    let deltaStr = '±0';
    if (r.result === 'correct') { label = '✅ 正解'; deltaClass = 'delta-pos'; deltaStr = '+2'; }
    else if (r.result === 'wrong') { label = '❌ 不正解'; deltaClass = 'delta-neg'; deltaStr = '-1'; }
    else if (r.result === 'fold') { label = '🏳 フォルド'; deltaStr = '±0'; }
    else if (r.result === 'no-call') { label = '― コールなし'; deltaStr = '±0'; }
    const guess = r.guess ? ` (宣言: ${r.guess.join('/')})` : '';
    return `<div class="result-row">
      <span>${name}${guess} ${label}</span>
      <span class="${deltaClass}">${deltaStr}</span>
    </div>`;
  }).join('');

  const isHost = myRole === 0;
  const isLastRound = (G.roundNum || 1) >= 3;
  const nextBtn = isHost
    ? `<button class="btn ${isLastRound ? 'btn-primary' : 'btn-success'} btn-big" onclick="doNextRound()">${isLastRound ? '🏆 ゲーム終了へ' : '次のラウンドへ ▶'}</button>`
    : `<div class="phase-banner">プレーヤー1（${G.playerNames[0]}）が${isLastRound ? 'ゲームを終了する' : '次のラウンドを開始する'}のを待っています…</div>`;

  return renderTopbar() + renderScorebar()
    + `<div class="section">
        <div class="phase-banner highlight">ラウンド ${G.roundNum} 終了</div>
        <div style="padding:10px 12px;">
          <div style="margin-bottom:10px;font-size:14px;color:#ffd700;">
            🂠 伏せカードは： <strong>${hiddenStr}</strong>
          </div>
          <div class="hidden-cards" style="justify-content:flex-start;gap:8px;">
            ${G.hiddenCards ? G.hiddenCards.map(c => `<div class="card-revealed ${c}">${c}</div>`).join('') : ''}
          </div>
        </div>
      </div>`
    + `<div class="section"><div class="section-title">結果</div>${rows}</div>`
    + `<div class="section">${nextBtn}</div>`
    + renderLog();
}

function renderMatchHistory() {
  try {
    const history = JSON.parse(localStorage.getItem('tt_history') || '[]');
    if (history.length === 0) return '';
    const medals = ['🥇', '🥈', '🥉'];
    const rows = history.map(entry => {
      const playerCells = entry.players.map((p, rank) =>
        `<td style="padding:3px 6px;text-align:center;${p.isSelf ? 'color:#7fff9a;font-weight:bold;' : 'color:#aac;'}">${medals[rank]}${p.name}<br><span style="font-size:10px;">${p.score}pt</span></td>`
      ).join('');
      return `<tr><td style="padding:3px 6px;font-size:11px;color:#667;white-space:nowrap;">${entry.date}</td>${playerCells}</tr>`;
    }).join('');
    return `<div class="section" style="margin-top:8px;">
      <div class="section-title" style="margin-bottom:6px;">直近の対戦結果</div>
      <div style="overflow-x:auto;">
        <table style="width:100%;border-collapse:collapse;font-size:12px;">
          <tbody>${rows}</tbody>
        </table>
      </div>
    </div>`;
  } catch(e) { return ''; }
}

function renderLobby() {
  if (lobbyPhase === 'enter-name') {
    return `<div class="lobby-title">トライアングル<br>タクティクス</div>
      <div class="lobby-sub">3人用推理カードゲーム</div>
      <div class="section">
        <label>プレーヤー名</label>
        <input type="text" id="inp-name" placeholder="名前を入力" value="${myName}" maxlength="12">
        <div class="btn-row" style="margin-top:10px;">
          <button class="btn btn-primary btn-big" onclick="doSetName()">決定</button>
        </div>
      </div>`;
  }
  if (lobbyPhase === 'menu') {
    return `<div class="lobby-title">トライアングル<br>タクティクス</div>
      <div class="lobby-sub">ようこそ、${myName} さん</div>
      <div class="section">
        <button class="btn btn-success btn-big" onclick="doCreateRoom()">🏠 部屋を作る（プレーヤー1）</button>
        <button class="btn btn-primary btn-big" onclick="lobbyPhase='join';render()">🚪 部屋に入る（プレーヤー2・3）</button>
      </div>
      <div class="info-box">
        ゲームには3人必要です。<br>
        1人が部屋を作り、残りの2人がコードで入室します。<br>
        人数が足りない場合は、部屋を作った後にCPUプレーヤーを追加できます。
      </div>
      ${renderMatchHistory()}`;
  }
  if (lobbyPhase === 'join') {
    setTimeout(fetchAndShowRooms, 50);
    return `<div class="section" style="padding-top:20px;">
      <div class="section-title">部屋を選んで入る</div>
      <div id="room-list" style="min-height:60px;"><div style="color:#aac;font-size:13px;padding:8px 0;">読み込み中…</div></div>
      <button class="btn btn-primary" style="margin-top:10px;width:100%;padding:8px;" onclick="fetchAndShowRooms()">🔄 更新</button>
      <button class="btn btn-gray btn-big" style="margin-top:8px;" onclick="lobbyPhase='menu';render()">← 戻る</button>
    </div>`;
  }
  return '';
}

function renderLobbyWaiting() {
  const fetchAndRender = async () => {
    try {
      const room = await fbRead(`/rooms/${roomId}`);
      const players = room?.players || {};
      const html = [0, 1, 2].map(i => {
        const p = players[i];
        const filled = p && p.name;
        const addCpuBtn = !filled && myRole === 0
          ? `<button class="btn btn-gray" style="font-size:11px;padding:2px 8px;margin-left:6px;" onclick="addCpuPlayer(${i})">CPU追加</button>`
          : '';
        return `<li>
          <span class="player-dot${filled ? '' : ' empty'}"></span>
          ${filled ? p.name + (p.cpu ? ' 🤖' : '') : `プレーヤー${i + 1}（待機中）`}
          ${i === myRole ? '<span class="player-badge-me">自分</span>' : ''}${addCpuBtn}
        </li>`;
      }).join('');
      document.getElementById('player-list-ul').innerHTML = html;
    } catch (e) {}
  };

  setTimeout(fetchAndRender, 100);

  return `<div class="lobby-title" style="font-size:20px;padding-top:20px;">待機中…</div>
    <div class="lobby-sub">3人揃うまでお待ちください</div>
    <div class="section">
      <ul class="player-list" id="player-list-ul">
        <li><span class="player-dot empty"></span>読み込み中…</li>
      </ul>
      <button class="btn btn-gray btn-big" style="margin-top:12px;" onclick="doLeaveWaiting()">← 戻る</button>
    </div>`;
}

function renderGameOver() {
  const sorted = [0, 1, 2].map(i => ({ i, name: G.playerNames[i], score: G.playerScores[i] }))
    .sort((a, b) => b.score - a.score);
  const medals = ['🥇', '🥈', '🥉'];
  const rows = sorted.map((p, rank) =>
    `<div class="result-row" style="${rank === 0 ? 'font-size:18px;' : ''}">
      <span>${medals[rank]} ${p.name}${p.i === myRole ? '（自分）' : ''}</span>
      <span class="${rank === 0 ? 'delta-pos' : 'delta-zero'}">${p.score}pt</span>
    </div>`
  ).join('');

  return renderTopbar()
    + renderScorebar()
    + `<div class="section" style="text-align:center;padding:24px 12px 10px;">
        <div style="font-size:28px;margin-bottom:8px;">🏆 ゲーム終了</div>
        <div style="font-size:13px;color:#88aadd;">3ラウンド終了</div>
      </div>`
    + `<div class="section">${rows}</div>`
    + `<div class="section">
        ${myRole === 0
          ? `<button class="btn btn-primary btn-big" onclick="doRematch()">もう一度プレイ（同じメンバーで）</button>`
          : `<div class="phase-banner" style="margin-bottom:8px;">${G.playerNames[0]} が次のゲームを開始するのを待っています…</div>`}
        <button class="btn btn-gray btn-big" style="margin-top:8px;" onclick="doQuitGame()">🚪 退出する</button>
      </div>`;
}

function render() {
  const app = document.getElementById('app');
  let html = '';

  if (errorMsg) {
    html += `<div class="error-banner">${errorMsg} <button onclick="errorMsg='';render()" style="float:right;background:none;border:none;color:#ffaaaa;cursor:pointer;">✕</button></div>`;
  }

  switch (localPhase) {
    case 'lobby':           html += renderTopbar() + renderLobby(); break;
    case 'lobby-waiting':   html += renderTopbar() + renderLobbyWaiting(); break;
    case 'question':        html += renderQuestionPhase(); break;
    case 'forced-call':        html += renderForcedCallPhase(); break;
    case 'call-response':
    case 'call-response-wait': html += renderCallResponsePhase(); break;
    case 'call-declare':
    case 'call-declare-wait':  html += renderCallDeclarePhase(); break;
    case 'round-end':       html += renderRoundEnd(); break;
    case 'game-over':       html += renderGameOver(); break;
    default: html += renderTopbar() + renderLobby();
  }

  app.innerHTML = html;
}

// ══════════════════════════════════════════
// イベントハンドラ
// ══════════════════════════════════════════
function doSetName() {
  const val = document.getElementById('inp-name')?.value.trim();
  if (!val) { errorMsg = '名前を入力してください'; render(); return; }
  myName = val;
  errorMsg = '';
  lobbyPhase = 'menu';
  render();
}

function doCreateRoom() {
  createRoom();
}

async function fetchAndShowRooms() {
  const el = document.getElementById('room-list');
  if (!el) return;
  el.innerHTML = '<div style="color:#aac;font-size:13px;padding:8px 0;">読み込み中…</div>';
  try {
    const rooms = await fbRead('/rooms');
    if (!rooms) { el.innerHTML = '<div style="color:#aac;font-size:13px;padding:8px 0;">部屋がありません</div>'; return; }
    // 5分経過かつゲーム未開始の部屋を削除
    await Promise.all(Object.entries(rooms).map(([id, room]) => {
      const stale = room.createdAt && Date.now() - room.createdAt > 5 * 60 * 1000;
      const notStarted = !room.game || room.game.phase == null;
      if (stale && notStarted) return fbWrite(`/rooms/${id}`, null).catch(() => {});
      return Promise.resolve();
    }));

    const items = Object.entries(rooms)
      .filter(([, room]) => {
        if (!room.players || !room.players[0]) return false;
        if (room.players[1] && room.players[2]) return false;
        if (room.createdAt && Date.now() - room.createdAt > 5 * 60 * 1000) return false;
        return true;
      })
      .map(([id, room]) => {
        const host = room.players[0]?.name || '?';
        const btn1 = !room.players[1]
          ? `<button class="btn btn-primary" style="flex:1" onclick="doJoinRoom(1,'${id}')">席2で入る</button>` : '';
        const btn2 = !room.players[2]
          ? `<button class="btn btn-warn" style="flex:1" onclick="doJoinRoom(2,'${id}')">席3で入る</button>` : '';
        return `<div style="padding:10px 0;border-bottom:1px solid rgba(255,255,255,0.1);">
          <div style="font-size:14px;margin-bottom:6px;">🏠 <strong>${host}</strong> の部屋</div>
          <div style="display:flex;gap:8px;">${btn1}${btn2}</div>
        </div>`;
      });
    el.innerHTML = items.length
      ? items.join('')
      : '<div style="color:#aac;font-size:13px;padding:8px 0;">入れる部屋がありません</div>';
  } catch (e) {
    el.innerHTML = '<div style="color:#f99;font-size:13px;padding:8px 0;">読み込みエラー</div>';
  }
}

function doJoinRoom(role, code) {
  if (!code) { errorMsg = '部屋を選択してください'; render(); return; }
  joinRoom(code, role);
}

function doSubmitQuestion() {
  if (!selCard || !selCount) return;
  submitQuestion(selCard, selCount);
  selCard = null;
  selCount = null;
}

function doCall() {
  if (myRole === null) return;
  if (G.callers && G.callers.includes(myRole)) { errorMsg = 'すでにコール済みです'; render(); return; }
  declareCall(myRole);
}

function doRespondCall(resp) {
  respondCall(myRole, resp);
}

function doForcedCallRespond(resp) {
  forcedCallRespond(myRole, resp);
}

function toggleGuessCard(type) {
  if (guessCards.length < 3) {
    guessCards.push(type);
  } else {
    // 3枚すでに選んでいたらその種類の最後の1枚を削除
    const idx = guessCards.lastIndexOf(type);
    if (idx !== -1) {
      guessCards.splice(idx, 1);
    }
  }
  render();
}

function doDeclareGuess() {
  if (guessCards.length !== 3) return;
  declareGuess(myRole, [...guessCards]);
  guessCards = [];
}

function doNextRound() {
  nextRound();
}

function doQuitGame() {
  if (sseGame) { sseGame.close(); sseGame = null; }
  sessionStorage.removeItem('tt_room');
  sessionStorage.removeItem('tt_role');
  sessionStorage.removeItem('tt_name');
  roomId = null; myRole = null; G = {};
  localPhase = 'lobby'; lobbyPhase = 'menu';
  render();
}

async function doRematch() {
  try {
    G = buildInitialG(G.playerNames, G.cpuPlayers);
    await syncGame();
    localPhase = 'question';
    render();
    if (myRole === 0) setTimeout(cpuTick, 500);
  } catch(e) { errorMsg = '通信エラー: ' + e.message; render(); }
}

// ══════════════════════════════════════════
// セッション復元 & 初期化
// ══════════════════════════════════════════
(function init() {
  const savedRoom = sessionStorage.getItem('tt_room');
  const savedRole = sessionStorage.getItem('tt_role');
  const savedName = sessionStorage.getItem('tt_name');

  if (savedRoom && savedRole !== null && savedName) {
    roomId = savedRoom;
    myRole = parseInt(savedRole);
    myName = savedName;
    startSSE();
    localPhase = 'lobby-waiting';
    // ゲームがすでに始まっていればSSEで更新される
  }

  render();
})();
</script>
</body>
</html>
