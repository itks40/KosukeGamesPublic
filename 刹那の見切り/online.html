<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>刹那の見切り - オンライン対戦</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0a0a1a;
      color: #fff;
      font-family: 'Arial', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 8px 0 32px;
      user-select: none;
    }

    #app {
      width: 100%;
      max-width: 480px;
      padding: 0 10px;
    }

    h1 {
      font-size: 2.2rem;
      color: #ffe066;
      text-shadow: 0 0 20px #ffaa00;
      margin-bottom: 4px;
      text-align: center;
      letter-spacing: 0.1em;
    }

    .subtitle {
      text-align: center;
      font-size: 0.85rem;
      color: #666;
      margin-bottom: 32px;
    }

    /* ===== LOBBY ===== */
    #screen-lobby {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .lobby-card {
      background: #111122;
      border: 1px solid #2a2a44;
      border-radius: 14px;
      padding: 24px 32px;
      width: 380px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .lobby-card h2 {
      font-size: 1rem;
      color: #ffe066;
      margin-bottom: 4px;
    }

    label {
      font-size: 0.85rem;
      color: #aaa;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    input[type=text] {
      background: #1a1a2e;
      border: 1px solid #444;
      border-radius: 6px;
      color: #fff;
      padding: 8px 12px;
      font-size: 0.95rem;
      outline: none;
      width: 100%;
    }

    input[type=text]:focus { border-color: #ffe066; }

    .btn {
      padding: 10px 28px;
      font-size: 0.95rem;
      border: 2px solid #ffe066;
      background: transparent;
      color: #ffe066;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.15s;
      letter-spacing: 0.05em;
      width: 100%;
    }
    .btn:hover { background: #ffe06622; box-shadow: 0 0 10px #ffaa0066; }
    .btn:active { transform: scale(0.96); }
    .btn:disabled { opacity: 0.35; cursor: default; }
    .btn-sub { border-color: #555; color: #888; font-size: 0.85rem; }
    .btn-sub:hover { border-color: #ffe066; color: #ffe066; }
    .btn-danger { border-color: #ff6666; color: #ff6666; }
    .btn-danger:hover { background: #ff000022; }

    .err-msg {
      color: #ff6666;
      font-size: 0.82rem;
      min-height: 1.2em;
      text-align: center;
    }

    /* ===== WAITING ROOM ===== */
    #screen-waiting {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }

    .room-code-box {
      background: #111122;
      border: 2px solid #ffe066;
      border-radius: 14px;
      padding: 28px 40px;
      text-align: center;
    }

    .room-code-label { font-size: 0.85rem; color: #aaa; margin-bottom: 10px; }

    .room-code {
      font-size: 3.5rem;
      font-weight: bold;
      color: #ffe066;
      text-shadow: 0 0 20px #ffaa00;
      letter-spacing: 0.25em;
    }

    .room-code-hint { font-size: 0.8rem; color: #555; margin-top: 10px; }

    .players-waiting {
      display: flex;
      gap: 32px;
      align-items: center;
    }

    .player-slot {
      width: 160px;
      padding: 16px;
      border-radius: 12px;
      border: 2px solid #333;
      background: #111122;
      text-align: center;
    }

    .player-slot.joined {
      border-color: #44ff88;
      background: #001a0d;
      box-shadow: 0 0 16px #00ff4433;
    }

    .slot-label { font-size: 0.8rem; color: #666; margin-bottom: 8px; }
    .slot-name { font-size: 1rem; font-weight: bold; color: #ddd; }
    .slot-status { font-size: 0.8rem; color: #555; margin-top: 6px; }
    .slot-status.ok { color: #44ff88; }

    .vs-label { font-size: 1.5rem; color: #444; font-weight: bold; }

    /* ===== GAME ===== */
    #screen-game { width: 100%; }

    .game-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      padding: 8px 12px;
      background: #0d0d1f;
      border-radius: 10px;
      font-size: 0.75rem;
    }

    .game-header .room-id { color: #555; }
    .game-header .match-info { color: #aaa; }

    /* P1・P2パネルを横並び、その上にシグナル */
    #players {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
    }

    .player-panel {
      flex: 1;
      min-width: 0;
      padding: 12px 10px;
      border-radius: 14px;
      border: 2px solid #333;
      background: #111122;
      text-align: center;
      transition: all 0.2s;
      position: relative;
    }

    .player-panel.me { border-color: #4466ff55; }
    .player-panel.winner { border-color: #ffe066; background: #1a1a00; box-shadow: 0 0 30px #ffaa0066; }
    .player-panel.loser { border-color: #660000; background: #110000; }

    .you-badge {
      position: absolute;
      top: -10px;
      left: 50%;
      transform: translateX(-50%);
      background: #4466ff;
      color: #fff;
      font-size: 0.65rem;
      padding: 2px 8px;
      border-radius: 10px;
    }

    .player-name { font-size: 0.9rem; font-weight: bold; color: #ccc; margin-bottom: 4px; }
    .player-score { font-size: 2.4rem; font-weight: bold; color: #ffe066; text-shadow: 0 0 10px #ffaa00; }
    .pip-row { display: flex; gap: 5px; justify-content: center; margin-top: 6px; }
    .pip { width: 10px; height: 10px; border-radius: 50%; background: #333; border: 1px solid #555; transition: all 0.2s; }
    .pip.filled { background: #ffe066; border-color: #ffaa00; box-shadow: 0 0 5px #ffaa00; }
    .player-reaction { font-size: 0.78rem; color: #aaa; margin-top: 6px; min-height: 1.1em; }

    /* シグナルエリアを常に上段・横幅いっぱいに */
    #center-area {
      order: -1;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    #signal-area {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      border: 4px solid #333;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0d0d1f;
      transition: all 0.15s;
    }

    #signal-area.ready { border-color: #ffaa00; background: #1a1200; box-shadow: 0 0 40px #ffaa0044; }
    #signal-area.attack { border-color: #ff4444; background: #1a0000; box-shadow: 0 0 60px #ff000088; animation: pulse 0.3s ease-out; }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }

    #signal-text { font-size: 1.5rem; font-weight: bold; color: #fff; text-align: center; line-height: 1.3; }
    #signal-sub { font-size: 0.78rem; color: #888; margin-top: 5px; }
    #foul-msg { color: #ff6666; font-size: 0.9rem; min-height: 1.2em; }
    #message { font-size: 1.2rem; color: #ccc; min-height: 1.8em; text-align: center; }
    #message.highlight { color: #ffe066; font-size: 1.5rem; text-shadow: 0 0 15px #ffaa00; }

    #btn-area { display: flex; gap: 12px; justify-content: center; margin-top: 10px; }

    /* attack flash */
    #attack-flash { position: fixed; inset: 0; pointer-events: none; opacity: 0; transition: opacity 0.05s; z-index: 10; }

    /* connection status */
    #conn-status {
      position: fixed;
      top: 10px;
      right: 14px;
      font-size: 0.75rem;
      color: #555;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #555;
    }
    .dot.ok { background: #44ff88; box-shadow: 0 0 5px #44ff88; }
    .dot.err { background: #ff4444; }

    /* ===== ROOM LIST ===== */
    #room-list-card {
      width: 100%;
    }

    #room-list-card h2 {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    #btn-refresh {
      font-size: 0.75rem;
      padding: 3px 10px;
      width: auto;
      border-color: #555;
      color: #888;
    }

    #btn-refresh:hover { border-color: #ffe066; color: #ffe066; }

    #room-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-height: 60px;
    }

    .room-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      background: #0d0d1f;
      border: 1px solid #2a2a44;
      border-radius: 8px;
      transition: border-color 0.15s;
    }

    .room-item:hover { border-color: #ffe06666; }

    .room-item-name {
      font-size: 0.95rem;
      color: #ddd;
    }

    .room-item-sub {
      font-size: 0.75rem;
      color: #555;
      margin-top: 2px;
    }

    .room-item .btn-join-room {
      padding: 6px 16px;
      font-size: 0.82rem;
      border: 1px solid #ffe066;
      background: transparent;
      color: #ffe066;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
    }

    .room-item .btn-join-room:hover { background: #ffe06622; }

    #room-list-empty {
      color: #555;
      font-size: 0.85rem;
      text-align: center;
      padding: 12px 0;
    }

    /* ===== SCREENS ===== */
    .screen { display: none; }
    .screen.active { display: flex; flex-direction: column; align-items: center; }
    #screen-game.active { display: block; }

    /* ===== TAP BUTTON ===== */
    #btn-tap {
      display: block;
      width: 100%;
      padding: 34px;
      margin-top: 14px;
      font-size: 2rem;
      font-weight: bold;
      letter-spacing: 0.1em;
      border: 3px solid #555;
      background: rgba(255,255,255,0.04);
      color: #666;
      border-radius: 18px;
      cursor: pointer;
      transition: all 0.1s;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    #btn-tap.ready {
      border-color: #ffaa00;
      color: #ffaa00;
      background: rgba(255,170,0,0.08);
    }
    #btn-tap.attacking {
      border-color: #ff4444;
      color: #ff4444;
      background: rgba(255,68,68,0.12);
      animation: tap-pulse 0.4s ease-out infinite alternate;
    }
    #btn-tap:active { transform: scale(0.97); }

    @keyframes tap-pulse {
      from { box-shadow: 0 0 10px #ff444455; }
      to   { box-shadow: 0 0 40px #ff4444aa; }
    }
  </style>
</head>
<body>

<div id="attack-flash"></div>
<div id="conn-status"><div class="dot" id="conn-dot"></div><span id="conn-text">接続中…</span></div>

<div id="app">
  <h1>⚔ 刹那の見切り</h1>
  <p class="subtitle">合図が出たらタップ！ — オンライン対戦</p>

  <!-- ===== LOBBY ===== -->
  <div id="screen-lobby" class="screen active">
    <div class="lobby-card">
      <h2>🎮 名前を入力</h2>
      <label>ニックネーム
        <input type="text" id="input-name" maxlength="12" placeholder="例: こうすけ" autocomplete="off">
      </label>
    </div>

    <div style="display:flex;flex-direction:column;gap:12px;width:100%;">
      <div class="lobby-card">
        <h2>🏠 部屋を作る</h2>
        <p style="font-size:0.82rem;color:#777;">あなたがP1になります</p>
        <button class="btn" id="btn-create">部屋を作る</button>
      </div>
      <div class="lobby-card" id="room-list-card">
        <h2>🚪 部屋を選んで入る <button class="btn btn-sub" id="btn-refresh">↺ 更新</button></h2>
        <div id="room-list">
          <div id="room-list-empty">読み込み中…</div>
        </div>
      </div>
    </div>
    <div class="err-msg" id="lobby-err"></div>
  </div>

  <!-- ===== WAITING ===== -->
  <div id="screen-waiting" class="screen">
    <div class="room-code-box">
      <div class="room-code-label">ルームコード</div>
      <div class="room-code" id="display-room-code">------</div>
      <div class="room-code-hint">このコードを相手に伝えてください</div>
    </div>

    <div class="players-waiting">
      <div class="player-slot joined" id="slot-p1">
        <div class="slot-label">Player 1 (ホスト)</div>
        <div class="slot-name" id="slot-p1-name">---</div>
        <div class="slot-status ok">✓ 接続済み</div>
      </div>
      <div class="vs-label">VS</div>
      <div class="player-slot" id="slot-p2">
        <div class="slot-label">Player 2</div>
        <div class="slot-name" id="slot-p2-name">待機中…</div>
        <div class="slot-status" id="slot-p2-status">接続待ち</div>
      </div>
    </div>

    <div id="waiting-msg" style="color:#aaa;font-size:0.9rem;"></div>
    <button class="btn btn-sub" id="btn-cancel-wait" style="width:160px;">キャンセル</button>
  </div>

  <!-- ===== GAME ===== -->
  <div id="screen-game" class="screen">
    <div class="game-header">
      <span class="room-id">ROOM: <b id="hdr-room-code"></b></span>
      <span class="match-info" id="hdr-match-info"></span>
      <button class="btn btn-sub btn-danger" id="btn-leave" style="width:auto;padding:5px 16px;font-size:0.8rem;">退出</button>
    </div>

    <div id="players">
      <div id="center-area">
        <div id="signal-area">
          <div id="signal-text">READY?</div>
          <div id="signal-sub">相手の接続を待っています</div>
        </div>
        <div id="foul-msg"></div>
        <div id="message"></div>
      </div>

      <div class="player-panel" id="p1-panel">
        <div class="player-name" id="p1-name-disp">Player 1</div>
        <div class="player-score" id="p1-score">0</div>
        <div class="pip-row" id="p1-pips"></div>
        <div class="player-reaction" id="p1-reaction"></div>
      </div>

      <div class="player-panel" id="p2-panel">
        <div class="player-name" id="p2-name-disp">Player 2</div>
        <div class="player-score" id="p2-score">0</div>
        <div class="pip-row" id="p2-pips"></div>
        <div class="player-reaction" id="p2-reaction"></div>
      </div>
    </div>

    <div id="btn-area">
      <button class="btn" id="btn-start" disabled>▶ スタート</button>
    </div>

    <button id="btn-tap">⚔ タップ！</button>
  </div>
</div>

<script>
// =============================================
// FIREBASE CONFIG (ボンドと同じDB)
// =============================================
const FIREBASE_DB_URL = 'https://setsuna-a37a5-default-rtdb.asia-southeast1.firebasedatabase.app';
const ROOMS_PATH = '/rooms';

// Firebase REST helpers
async function fbWrite(path, data) {
  const res = await fetch(`${FIREBASE_DB_URL}${path}.json`, {
    method: 'PUT',
    body: JSON.stringify(data),
  });
  if (!res.ok) throw new Error(`write failed: ${res.status}`);
  return res.json();
}

async function fbPatch(path, data) {
  const res = await fetch(`${FIREBASE_DB_URL}${path}.json`, {
    method: 'PATCH',
    body: JSON.stringify(data),
  });
  if (!res.ok) throw new Error(`patch failed: ${res.status}`);
  return res.json();
}

async function fbRead(path) {
  const res = await fetch(`${FIREBASE_DB_URL}${path}.json`);
  if (!res.ok) throw new Error(`read failed: ${res.status}`);
  return res.json();
}

function fbListen(path, cb) {
  const es = new EventSource(`${FIREBASE_DB_URL}${path}.json`);
  es.addEventListener('put', e => {
    try { cb(JSON.parse(e.data)); } catch {}
  });
  es.addEventListener('patch', e => {
    try { cb(JSON.parse(e.data)); } catch {}
  });
  es.onerror = () => setConn(false);
  es.onopen  = () => setConn(true);
  return es;
}

// =============================================
// SESSION STATE
// =============================================
const WIN_SCORE = 3;

const session = {
  myName:   '',
  mySlot:   null,   // 'p1' | 'p2'
  roomId:   null,
  es:       null,   // EventSource
  room:     null,   // latest room snapshot
  attackTimer: null,
};

// =============================================
// UI HELPERS
// =============================================
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function setConn(ok) {
  document.getElementById('conn-dot').className = 'dot ' + (ok ? 'ok' : 'err');
  document.getElementById('conn-text').textContent = ok ? 'オンライン' : '切断';
}

function setSignal(cls, main, sub) {
  const area = document.getElementById('signal-area');
  area.className = cls || '';
  document.getElementById('signal-text').textContent = main;
  document.getElementById('signal-sub').textContent  = sub || '';
}

function doFlash(color) {
  const f = document.getElementById('attack-flash');
  f.style.background = color;
  f.style.opacity = '0.5';
  setTimeout(() => f.style.opacity = '0', 120);
}

function renderPips(p1Score, p2Score) {
  ['p1', 'p2'].forEach((p, i) => {
    const row = document.getElementById(`${p}-pips`);
    row.innerHTML = '';
    const score = i === 0 ? p1Score : p2Score;
    for (let j = 0; j < WIN_SCORE; j++) {
      const d = document.createElement('div');
      d.className = 'pip' + (j < score ? ' filled' : '');
      row.appendChild(d);
    }
  });
}

function escHtml(s) {
  return String(s).replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// =============================================
// ROOM ID GENERATION
// =============================================
function genRoomId() {
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let id = '';
  for (let i = 0; i < 6; i++) id += chars[Math.floor(Math.random() * chars.length)];
  return id;
}

// =============================================
// LOBBY ACTIONS
// =============================================
document.getElementById('btn-create').addEventListener('click', async () => {
  const name = document.getElementById('input-name').value.trim();
  if (!name) { showErr('名前を入力してください'); return; }

  const roomId = genRoomId();
  const roomData = {
    p1: { name, score: 0 },
    p2: null,
    phase: 'waiting',
    round: 0,
    attackAt: null,
    p1Press: null,
    p2Press: null,
    createdAt: Date.now(),
  };
  try {
    await fbWrite(`${ROOMS_PATH}/${roomId}`, roomData);
    session.myName = name;
    session.mySlot = 'p1';
    session.roomId = roomId;
    stopRoomListRefresh();
    enterWaiting(roomId, roomData);
  } catch (e) {
    showErr('接続エラー: ' + e.message);
  }
});

async function joinRoom(code) {
  const name = document.getElementById('input-name').value.trim();
  if (!name) { showErr('先に名前を入力してください'); return; }

  try {
    const room = await fbRead(`${ROOMS_PATH}/${code}`);
    if (!room) { showErr('部屋が見つかりません'); return; }
    if (room.p2) { showErr('この部屋はすでに満員です'); await loadRoomList(); return; }

    await fbPatch(`${ROOMS_PATH}/${code}`, { p2: { name, score: 0 } });
    session.myName = name;
    session.mySlot = 'p2';
    session.roomId = code;
    stopRoomListRefresh();
    enterWaiting(code, { ...room, p2: { name, score: 0 } });
  } catch (e) {
    showErr('入室エラー: ' + e.message);
  }
}

function showErr(msg) {
  document.getElementById('lobby-err').textContent = msg;
  setTimeout(() => document.getElementById('lobby-err').textContent = '', 3000);
}

// =============================================
// ROOM LIST
// =============================================
let roomListTimer = null;

async function loadRoomList() {
  const listEl  = document.getElementById('room-list');
  const emptyEl = document.getElementById('room-list-empty');

  try {
    const all = await fbRead(ROOMS_PATH);
    const now = Date.now();
    const available = Object.entries(all || {})
      .filter(([, r]) => r && !r.p2 && r.phase === 'waiting' && (now - (r.createdAt || 0)) < 3600000)
      .sort(([, a], [, b]) => (b.createdAt || 0) - (a.createdAt || 0));

    listEl.innerHTML = '';
    if (available.length === 0) {
      listEl.innerHTML = '<div id="room-list-empty">待機中の部屋はありません</div>';
      return;
    }
    available.forEach(([roomId, r]) => {
      const item = document.createElement('div');
      item.className = 'room-item';
      const ago = Math.round((now - (r.createdAt || now)) / 1000);
      item.innerHTML = `
        <div>
          <div class="room-item-name">${escHtml(r.p1?.name || '??')}</div>
          <div class="room-item-sub">${ago}秒前に作成</div>
        </div>
        <button class="btn-join-room">参加する</button>
      `;
      item.querySelector('.btn-join-room').addEventListener('click', () => joinRoom(roomId));
      listEl.appendChild(item);
    });
  } catch {
    listEl.innerHTML = '<div id="room-list-empty">読み込みエラー</div>';
  }
}

function startRoomListRefresh() {
  loadRoomList();
  roomListTimer = setInterval(loadRoomList, 4000);
}

function stopRoomListRefresh() {
  clearInterval(roomListTimer);
  roomListTimer = null;
}

document.getElementById('btn-refresh').addEventListener('click', loadRoomList);

// ロビー表示時に自動更新開始
(function initLobby() {
  startRoomListRefresh();
})();

// =============================================
// WAITING ROOM
// =============================================
function enterWaiting(roomId, roomData) {
  document.getElementById('display-room-code').textContent = roomId;
  document.getElementById('slot-p1-name').textContent = roomData.p1?.name || '---';
  document.getElementById('slot-p2-name').textContent = roomData.p2?.name || '待機中…';
  document.getElementById('slot-p2-status').textContent = roomData.p2 ? '✓ 接続済み' : '接続待ち';
  document.getElementById('slot-p2-status').className = 'slot-status' + (roomData.p2 ? ' ok' : '');
  document.getElementById('slot-p2').className = 'player-slot' + (roomData.p2 ? ' joined' : '');
  document.getElementById('waiting-msg').textContent = '';
  enterGameScheduled = false;
  showScreen('screen-waiting');

  // start listening
  if (session.es) session.es.close();
  session.es = fbListen(`${ROOMS_PATH}/${roomId}`, onRoomUpdate);
  setConn(true);
}

document.getElementById('btn-cancel-wait').addEventListener('click', leaveRoom);

// =============================================
// ROOM UPDATE HANDLER
// =============================================
let enterGameScheduled = false;

function onRoomUpdate(event) {
  let room = event.data;
  if (!room) return;

  if (event.path === '/') {
    session.room = room;
  } else {
    if (!session.room) return;
    const keys = event.path.split('/').filter(Boolean);
    let obj = session.room;
    for (let i = 0; i < keys.length - 1; i++) {
      if (obj[keys[i]] == null) obj[keys[i]] = {};
      obj = obj[keys[i]];
    }
    obj[keys[keys.length - 1]] = room;
  }

  room = session.room;
  if (!room) return;

  // Waiting screen
  if (document.getElementById('screen-waiting').classList.contains('active')) {
    if (room.p2 && !enterGameScheduled) {
      enterGameScheduled = true;
      document.getElementById('slot-p2-name').textContent = room.p2.name;
      document.getElementById('slot-p2-status').textContent = '✓ 接続済み';
      document.getElementById('slot-p2-status').className = 'slot-status ok';
      document.getElementById('slot-p2').className = 'player-slot joined';
      document.getElementById('waiting-msg').textContent = '相手が入室しました！ゲームを開始します…';
      setTimeout(() => enterGame(session.room), 1200);
    }
    return;
  }

  // Game screen
  if (document.getElementById('screen-game').classList.contains('active')) {
    applyRoomToGame(room);
  }
}

// =============================================
// ENTER GAME
// =============================================
function enterGame(room) {
  showScreen('screen-game');
  prevPhase = null;
  localAttackShown = false;

  const p1Name = room.p1?.name || 'Player 1';
  const p2Name = room.p2?.name || 'Player 2';
  document.getElementById('p1-name-disp').textContent = p1Name;
  document.getElementById('p2-name-disp').textContent = p2Name;
  document.getElementById('hdr-room-code').textContent = session.roomId;
  document.getElementById('hdr-match-info').textContent = `先取 ${WIN_SCORE}ポイント`;

  // Show YOU badge
  const myPanel = document.getElementById(`${session.mySlot}-panel`);
  const oppSlot = session.mySlot === 'p1' ? 'p2' : 'p1';
  myPanel.classList.add('me');

  const badge = document.createElement('div');
  badge.className = 'you-badge';
  badge.textContent = 'あなた';
  myPanel.appendChild(badge);

  // Only P1 (host) can start rounds
  const btnStart = document.getElementById('btn-start');
  if (session.mySlot === 'p1') {
    btnStart.disabled = false;
    btnStart.textContent = '▶ スタート';
  } else {
    btnStart.disabled = true;
    btnStart.textContent = '相手のスタート待ち…';
  }

  renderPips(room.p1?.score || 0, room.p2?.score || 0);
  document.getElementById('p1-score').textContent = room.p1?.score || 0;
  document.getElementById('p2-score').textContent = room.p2?.score || 0;
  setSignal('ready', '⚠ 構えろ！', 'スタートを押してね');
  setTapBtn('idle');
  tapLocked = false;
}

// =============================================
// APPLY ROOM STATE TO GAME UI
// =============================================
let prevPhase = null;
let localAttackShown = false;
let tapLocked = false;

function applyRoomToGame(room) {
  const p1 = room.p1 || {};
  const p2 = room.p2 || {};

  // Update scores
  document.getElementById('p1-score').textContent = p1.score || 0;
  document.getElementById('p2-score').textContent = p2.score || 0;
  renderPips(p1.score || 0, p2.score || 0);

  const phase = room.phase;

  if (phase === 'countdown' && prevPhase !== 'countdown') {
    // New round started
    prevPhase = 'countdown';
    localAttackShown = false;
    tapLocked = false;
    clearTimeout(session.attackTimer);

    document.getElementById('p1-panel').className = 'player-panel' + (session.mySlot === 'p1' ? ' me' : '');
    document.getElementById('p2-panel').className = 'player-panel' + (session.mySlot === 'p2' ? ' me' : '');
    document.getElementById('p1-reaction').textContent = '';
    document.getElementById('p2-reaction').textContent = '';
    document.getElementById('foul-msg').textContent = '';
    document.getElementById('message').className = 'message';
    document.getElementById('message').textContent = '';

    setSignal('ready', '⚠ 構えろ！', '');
    setTapBtn('ready');
    document.getElementById('btn-start').disabled = true;

    // Schedule local attack display at attackAt
    const now = Date.now();
    const attackAt = room.attackAt;
    if (attackAt) {
      const delay = Math.max(0, attackAt - now);
      session.attackTimer = setTimeout(() => {
        if (session.room?.phase === 'countdown') {
          showLocalAttack();
        }
      }, delay);
    }
  }

  if (phase === 'result' && prevPhase !== 'result') {
    prevPhase = 'result';
    clearTimeout(session.attackTimer);
    localAttackShown = false;
    tapLocked = false;
    setTapBtn('done');

    const winner = room.result?.winner;
    const reactionMs = room.result?.reactionMs;
    const foul = room.result?.foul;

    // Reset panels
    document.getElementById('p1-panel').className = 'player-panel' + (session.mySlot === 'p1' ? ' me' : '');
    document.getElementById('p2-panel').className = 'player-panel' + (session.mySlot === 'p2' ? ' me' : '');

    if (foul) {
      const loserSlot = `p${foul}`;
      const winnerSlot = foul === 1 ? 'p2' : 'p1';
      document.getElementById(`${loserSlot}-panel`).classList.add('loser');
      document.getElementById(`${winnerSlot}-panel`).classList.add('winner');
      document.getElementById(`${loserSlot}-reaction`).textContent = '反則…';
      document.getElementById(`${winnerSlot}-reaction`).textContent = '勝利！';
      const foulName = foul === 1 ? (p1.name || 'P1') : (p2.name || 'P2');
      document.getElementById('foul-msg').textContent = `⚠ フライング！ ${foulName} の反則負け`;
      setSignal('', '⚠ フライング', '');
      doFlash('#ff000066');
    } else if (winner) {
      const wSlot = `p${winner}`;
      const lSlot = winner === 1 ? 'p2' : 'p1';
      document.getElementById(`${wSlot}-panel`).classList.add('winner');
      document.getElementById(`${lSlot}-panel`).classList.add('loser');
      const sec = reactionMs ? (reactionMs / 1000).toFixed(3) : '?';
      const wName = winner === 1 ? (p1.name || 'P1') : (p2.name || 'P2');
      document.getElementById(`${wSlot}-reaction`).textContent = `${sec}秒！`;
      document.getElementById(`${lSlot}-reaction`).textContent = '遅かった…';
      document.getElementById('foul-msg').textContent = '';
      setSignal('attack', `⚡ ${escHtml(wName)} の勝ち！`, `反応 ${sec}秒`);
      doFlash(winner === 1 ? '#4466ff88' : '#ff664488');
    } else {
      setSignal('', '⏱ 時間切れ', 'もう一回！');
    }

    // Check match over
    if ((p1.score || 0) >= WIN_SCORE || (p2.score || 0) >= WIN_SCORE) {
      prevPhase = 'matchover';
      const mw = (p1.score || 0) >= WIN_SCORE ? 1 : 2;
      const mwName = mw === 1 ? (p1.name || 'P1') : (p2.name || 'P2');
      setTimeout(() => {
        document.getElementById('message').className = 'message highlight';
        document.getElementById('message').textContent = `🏆 ${mwName} の勝利！`;
        setSignal('ready', `${escHtml(mwName)}\n優勝！`, `${WIN_SCORE}ポイント先取`);
      }, 800);
      return;
    }

    // Re-enable start for host
    if (session.mySlot === 'p1') {
      setTimeout(() => {
        document.getElementById('btn-start').disabled = false;
        document.getElementById('btn-start').textContent = '▶ 次のラウンド';
      }, 1000);
    }
  }
}

function showLocalAttack() {
  localAttackShown = true;
  setSignal('attack', '⚡ 今だ！', '');
  doFlash('#ff440088');
  setTapBtn('attacking');
}

function setTapBtn(state) {
  // state: 'idle' | 'ready' | 'attacking' | 'done'
  const btn = document.getElementById('btn-tap');
  const labels = { idle: '⚔ タップ！', ready: '⚠ 構えろ…', attacking: '⚡ 今だ！TAP！', done: '⚔ タップ！' };
  btn.className = state === 'idle' || state === 'done' ? '' : state;
  btn.textContent = labels[state] || '⚔ タップ！';
}

// =============================================
// PRESS HANDLER (キーボード・タップ共通)
// =============================================
async function handleMyPress() {
  if (!document.getElementById('screen-game').classList.contains('active')) return;

  const room = session.room;
  if (!room) return;

  const phase = room.phase;

  // フライング: 合図が出る前に押した
  if (phase === 'countdown' && !localAttackShown) {
    tapLocked = true;
    try {
      await fbPatch(`${ROOMS_PATH}/${session.roomId}`, {
        phase: 'result',
        result: { winner: session.mySlot === 'p1' ? 2 : 1, reactionMs: null, foul: session.mySlot === 'p1' ? 1 : 2 },
      });
      const oppSlot = session.mySlot === 'p1' ? 'p2' : 'p1';
      const newScore = (room[oppSlot]?.score || 0) + 1;
      await fbPatch(`${ROOMS_PATH}/${session.roomId}/${oppSlot}`, { score: newScore });
    } catch {}
    tapLocked = false;
    return;
  }

  // 合図が出ていない、またはすでに結果が出ている場合は無視
  if (!localAttackShown || phase === 'result') return;

  // 二重押し防止
  if (tapLocked) return;
  tapLocked = true;

  const pressTime = Date.now();

  // Write my press
  try {
    await fbPatch(`${ROOMS_PATH}/${session.roomId}`, {
      [`${session.mySlot}Press`]: pressTime,
    });
  } catch {}

  // P1 (host) が先に判定する (300ms待ってP2のpressTimeを拾う)
  if (session.mySlot === 'p1') {
    setTimeout(() => resolveRound(pressTime, null), 300);
  }
  // P2 はP1が判定した後のフォールバック (600ms後, まだcountdownなら判定)
  if (session.mySlot === 'p2') {
    setTimeout(() => {
      if (session.room?.phase === 'countdown') resolveRound(null, pressTime);
    }, 600);
  }
}

// タップボタン (touchstart + click の二重発火を防ぐ)
let _tapFired = false;
function _onTap(e) {
  e.preventDefault();
  if (_tapFired) return;
  _tapFired = true;
  setTimeout(() => _tapFired = false, 400);
  handleMyPress();
}
document.getElementById('btn-tap').addEventListener('touchstart', _onTap, { passive: false });
document.getElementById('btn-tap').addEventListener('click', _onTap);

async function resolveRound(myP1Press, myP2Press) {
  const room = session.room;
  if (!room || room.phase !== 'countdown') return; // already resolved

  const p1Press = myP1Press ?? room.p1Press;
  const p2Press = myP2Press ?? room.p2Press;
  const attackAt = room.attackAt;

  let winner, reactionMs;

  if (p1Press && p2Press) {
    // Both pressed: earliest wins
    if (p1Press <= p2Press) {
      winner = 1; reactionMs = Math.max(0, p1Press - attackAt);
    } else {
      winner = 2; reactionMs = Math.max(0, p2Press - attackAt);
    }
  } else if (p1Press) {
    winner = 1; reactionMs = Math.max(0, p1Press - attackAt);
  } else if (p2Press) {
    winner = 2; reactionMs = Math.max(0, p2Press - attackAt);
  } else {
    return; // nobody pressed yet
  }

  const winnerSlot = `p${winner}`;
  const newScore = (room[winnerSlot]?.score || 0) + 1;

  try {
    await fbPatch(`${ROOMS_PATH}/${session.roomId}`, {
      phase: 'result',
      result: { winner, reactionMs, foul: null },
    });
    await fbPatch(`${ROOMS_PATH}/${session.roomId}/${winnerSlot}`, { score: newScore });
  } catch {}
}

// =============================================
// START ROUND (host only)
// =============================================
document.getElementById('btn-start').addEventListener('click', async () => {
  if (session.mySlot !== 'p1') return;
  const room = session.room;
  if (!room?.p2) return;

  const delay = 1000 + Math.random() * 2500;
  const attackAt = Date.now() + delay;

  try {
    document.getElementById('btn-start').disabled = true;
    await fbPatch(`${ROOMS_PATH}/${session.roomId}`, {
      phase: 'countdown',
      attackAt,
      p1Press: null,
      p2Press: null,
      result: null,
      round: (room.round || 0) + 1,
    });
  } catch (e) {
    document.getElementById('btn-start').disabled = false;
  }
});

// =============================================
// LEAVE / EXIT
// =============================================
document.getElementById('btn-leave').addEventListener('click', leaveRoom);

function leaveRoom() {
  if (session.es) { session.es.close(); session.es = null; }
  clearTimeout(session.attackTimer);
  session.room = null;
  session.roomId = null;
  session.mySlot = null;
  prevPhase = null;
  localAttackShown = false;
  showScreen('screen-lobby');
  setConn(false);
  document.getElementById('lobby-err').textContent = '';
  startRoomListRefresh();
}
